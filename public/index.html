<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da API à IA · Aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/pele.js"></script>
<style>
  :root { --ink:#f7f0ff; --soft:#e4d6fb; --mute:#b9a0e6; --card:rgba(26,12,52,.9); --card2:rgba(56,30,104,.55); --deep2:rgba(14,6,32,.7); --line:rgba(185,138,255,.3);
    --purple:#b98aff; --deep:#7a3fe0; --pink:#ff7ab8; --gold:#ffd166; --ok:#56e695; --no:#ff6b7a; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:22px 16px;
    padding-top:calc(22px + env(safe-area-inset-top,0px)); padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(rgba(18,8,38,.52),rgba(18,8,38,.66)),url('/img/fundo.jpg') center/cover fixed #1a0c36; }
  .wrap { width:100%; max-width:800px; }
  .wrap.wide { max-width:1100px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; font-size:12.5px; font-weight:800; letter-spacing:.04em; }
  .badge { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 15px; max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#e6d4ff; backdrop-filter:blur(6px); }
  .badge.score { color:var(--gold); border-color:rgba(255,209,102,.6); }
  .dchip { font-weight:900; font-size:15px; padding:6px 15px; border-radius:999px; background:rgba(14,6,32,.85); border:2px solid var(--gold); color:var(--gold); font-variant-numeric:tabular-nums; }
  .dchip.low { color:var(--no); border-color:var(--no); animation:pulse .8s ease-in-out infinite; }
  .steps { display:flex; gap:7px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; }
  .step { font-size:11.5px; font-weight:800; padding:6px 12px; border-radius:999px; background:rgba(26,12,52,.6); color:#a58ad6; }
  .step.done { background:rgba(86,230,149,.16); color:var(--ok); }
  .step.now { background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; box-shadow:0 0 14px rgba(255,122,184,.5); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:34px 32px; box-shadow:0 24px 50px rgba(10,3,28,.55); backdrop-filter:blur(10px); animation:fadeUp .4s cubic-bezier(.21,1.02,.73,1); min-height:420px; display:flex; flex-direction:column; justify-content:center; }
  .card > * + * { margin-top:22px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }
  @keyframes pop { 0%{transform:scale(.8);opacity:0;} 60%{transform:scale(1.04);opacity:1;} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .kicker { font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--purple); }
  h2 { font-size:25px; margin:6px 0 0; letter-spacing:-.01em; line-height:1.2; }
  h3 { margin:0; font-size:16px; color:var(--gold); }
  p { line-height:1.6; font-size:16px; color:var(--soft); margin:0; }
  b, strong { color:var(--ink); }
  .muted { color:var(--mute); font-size:13.5px; }
  .center { text-align:center; }
  .btn { display:block; margin:0 auto; background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; border:none; border-radius:16px; padding:15px 28px; font:inherit; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 10px 24px rgba(165,107,255,.38); transition:transform .12s, filter .12s; }
  .btn:hover { transform:translateY(-2px); } .btn:active { transform:scale(.98); } .btn:disabled { opacity:.4; cursor:default; transform:none; box-shadow:none; }
  .btn.ghost { background:transparent; border:2px solid var(--purple); box-shadow:none; color:#e9dcff; padding:11px 18px; font-size:14.5px; }
  .btnrow { display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; } .btnrow .btn { margin:0; }
  .input, textarea { width:100%; min-width:0; padding:14px 16px; border-radius:14px; border:2px solid var(--line); background:var(--deep2); color:var(--ink); font:inherit; font-size:16px; }
  textarea { min-height:104px; resize:vertical; line-height:1.5; }
  .input:focus, textarea:focus { outline:none; border-color:var(--purple); }
  .row { display:flex; gap:10px; } .row .btn { white-space:nowrap; margin:0; padding:13px 20px; }
  .err { color:var(--no); font-size:14px; text-align:center; min-height:18px; }
  .link-btn { display:inline-flex; gap:8px; align-items:center; background:var(--card2); color:#efe4ff; border:2px solid var(--purple); border-radius:14px; padding:11px 17px; font-weight:800; text-decoration:none; font-size:14.5px; }
  .fb { padding:13px 16px; border-radius:14px; font-size:14.5px; font-weight:700; animation:pop .3s; line-height:1.5; }
  .fb.ok { background:rgba(86,230,149,.13); color:var(--ok); border:1px solid rgba(86,230,149,.6); } .fb.no { background:rgba(255,107,122,.13); color:var(--no); border:1px solid rgba(255,107,122,.6); }
  .fb.info { background:rgba(255,209,102,.09); color:var(--gold); border:1px solid rgba(255,209,102,.55); }
  .fb span.n { font-weight:500; color:var(--soft); } .fb b { color:inherit; }
  #fb > * + *, #nfb > * + *, .fbz > * + * { margin-top:14px; }
  .box { background:var(--card2); border:1px solid var(--line); border-radius:18px; padding:20px; } .box > * + * { margin-top:14px; }
  .head { display:flex; gap:18px; align-items:center; } .head .icon { margin:0; flex:none; } .head p { font-size:15.5px; margin-top:6px; }
  .icon { width:60px; height:60px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:30px; background:linear-gradient(135deg,var(--deep),var(--pink)); margin:0 auto; box-shadow:0 10px 22px rgba(165,107,255,.35); }
  /* como funciona */
  .how { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .how .st { background:var(--deep2); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:14.5px; line-height:1.5; color:var(--soft); }
  .how .n { flex:none; width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .art { display:flex; gap:12px; align-items:flex-start; background:rgba(255,209,102,.07); border-left:4px solid var(--gold); border-radius:12px; padding:13px 16px; font-size:14.5px; line-height:1.55; color:var(--soft); }
  .art .ic { font-size:20px; line-height:1.2; }
  /* grade de fotos */
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .grid6 { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .pc { background:var(--card2); border:2px solid transparent; border-radius:18px; padding:10px; display:flex; flex-direction:column; gap:9px; }
  .pc.right { border-color:var(--ok); } .pc.wrong { border-color:var(--no); }
  .ph { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:#0b0e1c; }
  .ph svg.pele { width:100%; height:100%; display:block; }
  .tag { position:absolute; top:7px; left:7px; font-size:12px; font-weight:800; padding:4px 9px; border-radius:9px; color:#fff; background:rgba(14,6,32,.85); backdrop-filter:blur(4px); }
  .tag.r { left:auto; right:7px; }
  .tag.sus { background:rgba(180,40,70,.9); } .tag.ben { background:rgba(30,120,80,.9); }
  .cap { font-size:13.5px; color:var(--soft); text-align:center; } .cap b { color:var(--ink); }
  .q { font-size:11.5px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; border:2px solid var(--line); background:var(--deep2); color:var(--soft); border-radius:11px; padding:8px 4px; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .seg button.on { background:rgba(185,138,255,.22); border-color:var(--purple); color:#fff; }
  .seg button.on.y { background:rgba(86,230,149,.18); border-color:var(--ok); color:var(--ok); } .seg button.on.n { background:rgba(255,107,122,.18); border-color:var(--no); color:var(--no); }
  .chips { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip { background:var(--card2); border:2px solid var(--line); color:#efe4ff; border-radius:999px; padding:10px 17px; font:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .chip.on { background:linear-gradient(135deg,var(--deep),var(--pink)); border-color:transparent; color:#fff; }
  .chip.good { border-color:var(--ok); color:var(--ok); background:rgba(86,230,149,.12); } .chip.bad { border-color:var(--no); color:var(--no); background:rgba(255,107,122,.12); }
  .legend { display:flex; gap:16px; justify-content:center; font-size:13px; color:var(--mute); flex-wrap:wrap; }
  /* pesquisa */
  .qmeta { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { font-size:12.5px; font-weight:700; border-radius:999px; padding:5px 11px; background:var(--deep2); border:1px solid var(--line); color:var(--soft); }
  .pill.find { border-color:rgba(255,209,102,.55); color:var(--gold); } .pill.find code { font-family:inherit; font-weight:800; }
  .qtext { color:var(--ink); font-size:16.5px; font-weight:600; }
  /* Pokémon (treinador) */
  .foto { position:relative; aspect-ratio:4/3; border-radius:12px; background-size:cover; background-position:center; overflow:hidden; }
  .foto img { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); height:70%; max-width:85%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .t-Fogo { background:#e8692b !important; } .t-Água { background:#3d7fe0 !important; } .t-Planta { background:#3f9e45 !important; }
  .pick { cursor:pointer; position:relative; transition:transform .1s; } .pick:hover { transform:translateY(-2px); }
  .pick.on { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .pick.on::after { content:'✓'; position:absolute; top:14px; right:16px; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#2b1a00; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .nm { font-weight:800; font-size:13.5px; text-align:center; } .nm .muted { font-weight:600; font-size:12px; }
  .counter { font-weight:900; color:var(--gold); }
  .regras { font-family:ui-monospace,Consolas,monospace; font-size:14px; background:rgba(10,4,26,.85); border:1px solid var(--line); border-radius:12px; padding:10px 14px; color:var(--gold); }
  .grid4.pool3 { grid-template-columns:repeat(3,1fr); }
  .mini .foto { aspect-ratio:1; } .mini .nm { font-size:11.5px; }
  .two { display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start; }
  .brain { position:sticky; top:12px; background:linear-gradient(160deg,rgba(122,63,224,.32),rgba(255,122,184,.14)); border:1px solid var(--purple); border-radius:20px; padding:18px; } .brain > * + * { margin-top:14px; }
  .meter { display:grid; grid-template-columns:86px 1fr 46px; gap:10px; align-items:center; font-size:14px; font-weight:700; }
  .meter .t { height:14px; border-radius:8px; background:var(--deep2); overflow:hidden; } .meter .t i { display:block; height:100%; border-radius:8px; background:var(--ok); transition:width .25s, background .25s; }
  .meter.hot .t i { background:var(--no); } .meter b { text-align:right; font-variant-numeric:tabular-nums; }
  .types { display:flex; gap:8px; } .types span { flex:1; text-align:center; border-radius:12px; padding:7px 4px; font-size:13px; font-weight:800; background:var(--deep2); border:1px dashed var(--line); color:var(--mute); }
  .types span.on { border-style:solid; border-color:var(--ok); color:var(--ok); background:rgba(86,230,149,.1); }
  .verdict { border-radius:14px; padding:12px 14px; font-weight:800; font-size:14.5px; line-height:1.45; background:var(--deep2); border:1px solid var(--line); }
  .verdict.bad { border-color:var(--no); color:var(--no); } .verdict.good { border-color:var(--ok); color:var(--ok); }
  .rules3 { display:grid; gap:10px; } .rules3 div { display:flex; gap:12px; align-items:flex-start; font-size:14.5px; line-height:1.5; color:var(--soft); }
  .rules3 .e { flex:none; font-size:20px; }
  /* auditoria */
  .timer-bar { height:12px; background:var(--deep2); border-radius:8px; overflow:hidden; } .timer-fill { height:100%; width:100%; background:linear-gradient(90deg,var(--gold),var(--pink)); }
  .situation { background:var(--card2); border:2px dashed var(--purple); border-radius:18px; padding:24px; font-size:18.5px; line-height:1.55; color:var(--ink); text-align:center; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .opt { border:2px solid var(--line); background:var(--card2); border-radius:16px; padding:18px 10px; color:var(--ink); font:inherit; font-weight:800; font-size:15px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .opt .e { font-size:28px; } .opt:hover { border-color:var(--purple); }
  .opt.correct { border-color:var(--ok); background:rgba(86,230,149,.14); animation:pop .3s; } .opt.wrong { border-color:var(--no); opacity:.6; }
  /* plano */
  .plist { display:grid; gap:10px; }
  .pitem { display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--card2); border:2px solid var(--line); border-radius:14px; padding:13px 15px; font:inherit; color:var(--soft); font-size:15px; cursor:pointer; line-height:1.45; }
  .pitem .ck { flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--line); margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; }
  .pitem.on { border-color:var(--purple); color:var(--ink); } .pitem.on .ck { background:var(--purple); border-color:var(--purple); color:#fff; }
  .pitem.good { border-color:var(--ok); } .pitem.bad { border-color:var(--no); } .pitem .why { display:block; font-size:13px; color:var(--no); margin-top:4px; }
  /* ranking */
  .rk { background:var(--card2); border:1px solid var(--line); border-radius:18px; padding:16px 20px; max-width:440px; margin-left:auto; margin-right:auto; width:100%; }
  .rk h4 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); text-align:center; }
  .rk .r { display:flex; justify-content:space-between; gap:10px; padding:4px 0; font-size:15px; } .rk .r b { color:var(--gold); }
  .rk .me { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); text-align:center; font-weight:800; color:var(--gold); }
  .big { font-size:56px; font-weight:900; color:var(--gold); text-align:center; animation:pop .4s; }
  .peek { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:420px; margin-left:auto; margin-right:auto; }
  .peek .ph { border:2px solid var(--line); animation:floaty 3.4s ease-in-out infinite; } .peek .ph:nth-child(2) { animation-delay:.5s; } .peek .ph:nth-child(3) { animation-delay:1s; }
  @media (max-width:900px){ .grid3{grid-template-columns:repeat(2,1fr);} .grid6{grid-template-columns:repeat(3,1fr);} .two{grid-template-columns:1fr;} .brain{position:static;} }
  @media (max-width:640px){ .grid4, .grid4.pool3{grid-template-columns:repeat(2,1fr);} .three, .how{grid-template-columns:1fr;} .card{padding:24px 16px;} .card > * + * { margin-top:18px; } .head{align-items:flex-start;} .badge{max-width:34%;} .grid3{gap:12px;} h2{font-size:22px;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="topbar"><span class="badge" id="nickBadge">Aula</span><span class="dchip" id="stageChip" style="display:none"></span><span class="badge score">⭐ <span id="score">0</span> pts</span></div>
  <div class="steps" id="steps"></div>
  <div class="card" id="app"></div>
</div>
<script>
const app = document.getElementById('app');
let me = JSON.parse(localStorage.getItem('aula_ia2_me') || 'null');
let curStage = null, lastSeq = -1, timer = null, stageTimer = null, score = 0, routing = 0, lastIdx = -1;
const ORDER = [['detetive', '1 · Detetive'], ['pesquisa', '3 · Pesquisa'], ['treino', '4 · Treinador'], ['auditoria', '5 · Auditoria'], ['plano', '6 · Plano de dados']];
const TIPO_E = { 'Fogo': '🔥', 'Água': '💧', 'Planta': '🌿' };
const TIPOS = ['Fogo', 'Água', 'Planta'];
const FUNDO_N = { vulcao: 'vulcão', mar: 'mar', grama: 'grama' };

const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (ms) => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const setScore = (n) => { score = n; document.getElementById('score').textContent = n; };
const addScore = (n) => setScore(score + (n || 0));
const clearTimer = () => { if (timer) { clearInterval(timer); timer = null; } };
const wide = (on) => document.getElementById('wrap').classList.toggle('wide', !!on);
const foto = (pk, fundo, extra = '') => `<div class="foto" style="background-image:url('/img/bg-${fundo}.jpg')"><img src="/img/pk-${pk}.png" alt="${esc(pk)}">${extra}</div>`;
const tipoTag = (t, cls = '') => `<span class="tag ${cls} t-${t}">${TIPO_E[t] || ''} ${t}</span>`;
const isMsg = (e) => !['closed', 'reset'].includes(e.message);
const how = (steps) => `<div class="how">${steps.map((s, i) => `<div class="st"><span class="n">${i + 1}</span><span>${s}</span></div>`).join('')}</div>`;
const art = (html) => `<div class="art"><span class="ic">📄</span><span>${html}</span></div>`;
const iaTag = (f) => `<span class="tag ${f.ia === 'Suspeita' ? 'sus' : 'ben'}">🤖 IA: ${esc(f.ia)} · ${f.conf}%</span>`;

function paintSteps(stage) {
  const i = ORDER.findIndex((o) => o[0] === stage); if (i >= 0) lastIdx = i;
  const reached = stage === 'final' ? ORDER.length : lastIdx;
  document.getElementById('steps').innerHTML = ORDER.map((o, k) => `<span class="step ${stage === 'final' || k < reached ? 'done' : k === i ? 'now' : ''}">${o[1]}</span>`).join('');
}
async function api(action, extra = {}) {
  const r = await fetch('/api/play', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, id: me && me.id, ...extra }) });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && j.error === 'unknown_player') { localStorage.removeItem('aula_ia2_me'); me = null; showJoin(); throw new Error('reset'); }
  if (r.status === 409 && j.error === 'closed') { if (j.timeup) showTimeUp(j.stage); else route(j.stage); throw new Error('closed'); }
  if (!r.ok) throw new Error(j.error || 'erro');
  return j;
}
function stageChip(ms, stage) {
  const chip = document.getElementById('stageChip');
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  if (ms == null) { chip.style.display = 'none'; return; }
  chip.style.display = ''; const t0 = Date.now();
  const tick = () => {
    const left = Math.max(0, ms - (Date.now() - t0));
    chip.textContent = '⏱ ' + fmt(left); chip.classList.toggle('low', left < 15000);
    if (left <= 0) { clearInterval(stageTimer); stageTimer = null; chip.style.display = 'none'; if (curStage === stage && app.dataset.playing === stage) showTimeUp(stage); }
  };
  tick(); stageTimer = setInterval(tick, 250);
}
const playing = (stage) => { app.dataset.playing = stage; };
const later = (stage, ms) => setTimeout(() => { if (curStage === stage) waitDone(stage); }, ms);

// ---------- entrada ----------
const PEEK = [{ id: 'j1', tom: 2, lesao: 'suspeita', regua: true }, { id: 'j2', tom: 5, lesao: 'benigna', regua: false }, { id: 'j3', tom: 3, lesao: 'benigna', regua: true }];
function showJoin(msg) {
  clearTimer(); stageChip(null); wide(false); playing(''); document.getElementById('nickBadge').textContent = 'Aula'; paintSteps('lobby');
  app.innerHTML = `
    <div class="center"><div class="kicker">Da API à IA</div><h2>A IA só aprende o que os dados mostram</h2></div>
    <div class="peek">${PEEK.map((f) => `<div class="ph">${pele(f)}</div>`).join('')}</div>
    <p class="center">Hoje você vai investigar uma IA que olha fotos de pele. Escolha um apelido para entrar: ele aparece no ranking da turma.</p>
    <input class="input" id="nick" maxlength="24" placeholder="Seu apelido" autocomplete="off">
    <div class="err" id="joinErr">${msg || ''}</div>
    <button class="btn" id="joinBtn">Entrar na aula</button>`;
  const go = async () => {

// ---------- roteamento ----------
async function route(stage) {
  const mine = ++routing;
  if (!me) return showJoin();
  curStage = stage; clearTimer(); stageChip(null); paintSteps(stage); playing(''); wide(false);
  if (stage === 'lobby' || stage === 'closed') return showWait(stage);
  try {
    if (stage === 'final') return await showFinal();
    const d = await api('enter', { stage });
    if (mine !== routing) return;
    api('me').then((m) => setScore(m.total)).catch(() => {});
    if (d.done) return waitDone(stage);
    if (d.remainingMs === 0) return showTimeUp(stage);
    stageChip(d.remainingMs, stage); playing(stage);
    ({ detetive: showDetetive, pesquisa: showPesquisa, treino: showTreino, auditoria: runAuditoria, plano: showPlano })[stage](d);
  } catch (e) { /* closed/reset já tratados */ }
}

// ---------- 4) Treinador de IA ----------
// Mesma regra do servidor: uma pista vira atalho se, sozinha, explica pelo menos 5 das 6 fotos.
function pista(cards, campo) {
  const m = {};
  cards.forEach((c) => { const v = c[campo]; m[v] = m[v] || {}; m[v][c.tipo] = (m[v][c.tipo] || 0) + 1; });
  const ok = Object.values(m).reduce((s, cnt) => s + Math.max(...Object.values(cnt)), 0);
  return { ok, grupos: Object.keys(m).length };
}

    <div class="situation">${esc(n.q)}</div>
    <div class="three" id="opts">${n.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="e">${E[i]}</span>${esc(o)}</button>`).join('')}</div>
    <p class="muted center">✂️ aprendeu um detalhe da foto · 👥 faltou gente nos dados · 🧠 funciona fora do treino</p>
    <div id="fb"></div>`;
  let answered = false;
  const send = async (choice) => {
    if (answered) return; answered = true; clearTimer();
    app.querySelectorAll('#opts button').forEach((b) => b.disabled = true);
    try {
      const r = await api('audit_answer', { choice });
      const btns = app.querySelectorAll('#opts button'); btns[r.correctIndex].classList.add('correct'); if (!r.correct && choice >= 0) btns[choice].classList.add('wrong');
      addScore(r.points);
      document.getElementById('fb').innerHTML = r.correct ? `<div class="fb ok">✅ Isso! +${r.points} pontos<br><span class="n">${esc(r.why)}</span></div>` : `<div class="fb no">${choice < 0 || r.timedOut ? '⏱️ Tempo esgotado.' : '❌ Não foi dessa vez.'}<br><span class="n">${esc(r.why)}</span></div>`;
      setTimeout(() => { if (curStage === 'auditoria') runAuditoria(); }, 3600);
    } catch {}
  };
  app.querySelectorAll('#opts button').forEach((b) => b.onclick = () => send(Number(b.dataset.i)));
  const bar = document.getElementById('bar'); const ms = n.remainingMs; const t0 = Date.now();
  clearTimer(); timer = setInterval(() => { const left = Math.max(0, ms - (Date.now() - t0)); bar.style.width = (left / limit * 100) + '%'; if (left <= 0) { clearTimer(); send(-1); } }, 100);
}

// ---------- 6) Plano de dados ----------
function showPlano(d) {
  wide(false);
  const sel = new Set();
  app.innerHTML = `
    <div class="head"><div class="icon">🗂️</div><div><div class="kicker">Atividade 6 · Criar</div><h2>Plano de dados</h2><p>${esc(d.pergunta)}</p></div></div>
    ${how(['Leia as 9 ações. Algumas protegem a IA, outras são <b>armadilhas</b>.', 'Escolha as <b>4</b> que evitam atalhos e falta de representatividade.', 'Justifique em uma frase. Ela vai para o mural.'])}
    <div class="plist" id="pl">${d.opcoes.map((o) => `<button class="pitem" data-id="${o.id}"><span class="ck"></span><span>${esc(o.text)}<span class="why"></span></span></button>`).join('')}</div>
    <div class="btnrow"><span class="counter" id="cnt">0/${d.escolher} escolhidas</span></div>
    <textarea id="frase" maxlength="220" placeholder="Justifique em uma ou duas frases: por que essas ações evitam atalhos e falta de representatividade?"></textarea>
    <div id="fb"></div>
    <button class="btn" id="send">📌 Enviar meu plano</button>`;
  const cnt = document.getElementById('cnt');
  app.querySelectorAll('.pitem').forEach((b) => b.onclick = () => {
    if (b.disabled) return; const id = b.dataset.id;
    if (sel.has(id)) sel.delete(id); else if (sel.size < d.escolher) sel.add(id);
    b.classList.toggle('on', sel.has(id)); b.querySelector('.ck').textContent = sel.has(id) ? '✓' : ''; cnt.textContent = `${sel.size}/${d.escolher} escolhidas`;
  });
  document.getElementById('send').onclick = async () => {
    const fb = document.getElementById('fb');
    if (sel.size !== d.escolher) { fb.innerHTML = `<div class="fb no">Escolha exatamente ${d.escolher} ações.</div>`; return; }
    const frase = document.getElementById('frase').value;
    try {
      const r = await api('plano_submit', { ids: [...sel], frase });
      playing(''); document.getElementById('send').disabled = true; addScore(r.points);
      r.feedback.forEach((f) => {
        const b = app.querySelector(`.pitem[data-id="${f.id}"]`); b.disabled = true;
        if (f.escolhida) { b.classList.add(f.boa ? 'good' : 'bad'); if (!f.boa) b.querySelector('.why').textContent = f.por; }
        else if (f.boa) b.classList.add('good');
      });
      fb.innerHTML = `<div class="fb ok">📌 Plano enviado! ${r.boas} de ${d.escolher} ações fortes · +${r.points} pontos</div><p class="muted center">Em verde: as ações que realmente protegem a IA. Veja o mural na tela da professora.</p>`;
      later('plano', 12000);
    } catch (e) { if (isMsg(e)) fb.innerHTML = `<div class="fb no">${esc(e.message)}</div>`; }
  };
}

  const f = await api('final'); setScore(f.total);
  app.innerHTML = `

    <h2 class="center">Aula concluída</h2>
    <div class="big">${f.total} pts</div>

}

// ---------- polling ----------
async function poll() {
  try { const r = await fetch('/api/state'); const s = await r.json(); if (me && (s.seq !== lastSeq || s.stage !== curStage)) { lastSeq = s.seq; route(s.stage); } } catch {}
  setTimeout(poll, 2300 + Math.random() * 900);
}
paintSteps('lobby');
if (me) { document.getElementById('nickBadge').textContent = me.nick; api('me').then((m) => setScore(m.total)).catch(() => {}); } else showJoin();
poll();
