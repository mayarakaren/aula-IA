<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A IA adora colar · Aula</title>
<style>
  :root { --ink:#f6efff; --bg2:rgba(52,28,98,.78); --card:rgba(26,12,52,.88); --purple:#b98aff; --purple-deep:#7a3fe0; --pink:#ff7ab8; --gold:#ffd166; --green:#56e695; --red:#ff6b7a; --line:rgba(185,138,255,.32); }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px 14px;
    padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(rgba(18,8,38,.50),rgba(18,8,38,.62)),url('/img/fundo.jpg') center/cover fixed #1a0c36; }
  .wrap { width:100%; max-width:820px; position:relative; z-index:1; }
  .wrap.wide { max-width:1040px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#e6d4ff; }
  .badge { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 14px; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge.score { border-color:var(--gold); color:var(--gold); }
  .dchip { font-weight:900; font-size:15px; padding:5px 14px; border-radius:20px; background:rgba(14,6,32,.85); border:2px solid var(--gold); color:var(--gold); }
  .dchip.low { color:var(--red); border-color:var(--red); animation:pulse .8s ease-in-out infinite; }
  .steps { display:flex; gap:6px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .step { font-size:11px; font-weight:800; padding:5px 11px; border-radius:20px; background:rgba(26,12,52,.55); color:#a58ad6; }
  .step.done { background:rgba(86,230,149,.16); color:var(--green); }
  .step.now { background:linear-gradient(135deg,var(--purple-deep),var(--pink)); color:#fff; box-shadow:0 0 14px rgba(255,122,184,.55); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:26px 24px; box-shadow:0 22px 46px rgba(10,3,28,.55); backdrop-filter:blur(8px); animation:fadeUp .4s cubic-bezier(.21,1.02,.73,1); min-height:420px; display:flex; flex-direction:column; justify-content:center; }
  .card > * + * { margin-top:14px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pop { 0%{transform:scale(.7);opacity:0;} 60%{transform:scale(1.07);opacity:1;} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-10px) rotate(2deg);} }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
  h2 { font-size:22px; margin:0; text-align:center; }
  h3 { margin:0; font-size:15px; color:var(--gold); }
  p { line-height:1.55; font-size:16px; color:#e2d3fb; margin:0; }
  .muted { color:#b79ce8; font-size:13px; text-align:center; }
  .center { text-align:center; }
  .btn { display:block; margin:0 auto; background:linear-gradient(135deg,var(--purple-deep),var(--pink)); color:#fff; border:none; border-radius:16px; padding:14px 26px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 10px 24px rgba(165,107,255,.4); transition:transform .12s; }
  .btn:hover { transform:translateY(-2px); } .btn:disabled { opacity:.45; cursor:default; transform:none; }
  .btn.ghost { background:transparent; border:2px solid var(--purple); box-shadow:none; color:#e9dcff; padding:10px 18px; font-size:14px; }
  .btnrow { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; } .btnrow .btn { margin:0; }
  .input { width:100%; min-width:0; padding:13px 15px; border-radius:14px; border:2px solid var(--line); background:rgba(14,6,32,.7); color:var(--ink); font-size:16px; }
  .input:focus { outline:none; border-color:var(--purple); }
  .row { display:flex; gap:10px; } .row .btn { white-space:nowrap; margin:0; }
  .err { color:var(--red); font-size:14px; text-align:center; min-height:18px; }
  .link-btn { display:inline-block; background:rgba(52,28,98,.85); color:#e9dcff; border:2px solid var(--purple); border-radius:14px; padding:11px 18px; font-weight:800; text-decoration:none; font-size:15px; }
  .meme { max-height:150px; max-width:100%; border-radius:14px; display:block; margin:0 auto; border:2px solid var(--line); }
  .qmark { width:62px; height:62px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:900; background:radial-gradient(circle at 35% 30%,#8a52ff,#3b1a80); border:3px solid #e6d4ff; }
  .head { display:flex; gap:14px; align-items:center; } .head h2 { text-align:left; font-size:21px; } .head p { font-size:14.5px; margin-top:4px; }
  .fb { padding:12px 14px; border-radius:12px; font-size:14px; font-weight:700; animation:pop .3s; }
  .fb.ok { background:rgba(86,230,149,.15); color:var(--green); border:1px solid var(--green); } .fb.no { background:rgba(255,107,122,.15); color:var(--red); border:1px solid var(--red); }
  .fb.info { background:rgba(255,209,102,.1); color:var(--gold); border:1px solid var(--gold); }
  /* ---- "fotos" ---- */
  .foto { position:relative; aspect-ratio:4/3; border-radius:14px; background-size:cover; background-position:center; overflow:hidden; border:2px solid rgba(255,255,255,.15); }
  .foto img { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); height:70%; max-width:85%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .tag { position:absolute; top:6px; left:6px; font-size:11.5px; font-weight:900; padding:3px 8px; border-radius:10px; color:#fff; background:rgba(14,6,32,.82); }
  .tag.r { left:auto; right:6px; }
  .t-Fogo { background:#e8692b !important; } .t-Água { background:#3d7fe0 !important; } .t-Planta { background:#3f9e45 !important; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .pcard { background:var(--bg2); border:2px solid transparent; border-radius:16px; padding:8px; display:flex; flex-direction:column; gap:7px; }
  .pcard .nm { font-weight:800; font-size:13px; text-align:center; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; border:2px solid var(--line); background:rgba(14,6,32,.6); color:#e2d3fb; border-radius:10px; padding:6px 4px; font-weight:800; font-size:12.5px; cursor:pointer; }
  .seg button.on.y { background:rgba(86,230,149,.2); border-color:var(--green); color:var(--green); } .seg button.on.n { background:rgba(255,107,122,.2); border-color:var(--red); color:var(--red); }
  .ficha { font-size:11.5px; border:1px dashed var(--line); background:transparent; color:#cdb8f3; border-radius:10px; padding:4px; cursor:pointer; }
  .ficha.open { border-style:solid; border-color:var(--gold); color:var(--gold); font-weight:800; }
  .pcard.right { border-color:var(--green); } .pcard.wrong { border-color:var(--red); }
  @media (min-width:761px){ .compact .foto { aspect-ratio:16/9; } .compact .pcard { gap:5px; padding:6px; } .compact .nm { font-size:12.5px; } }
  .pv .foto { max-width:240px; margin:0 auto; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .chip { background:var(--bg2); border:2px solid var(--line); color:#e9dcff; border-radius:20px; padding:9px 16px; font-size:14px; font-weight:800; cursor:pointer; }
  .chip.on { background:linear-gradient(135deg,var(--purple-deep),var(--pink)); border-color:transparent; color:#fff; }
  /* treinador */
  .pick { cursor:pointer; position:relative; transition:transform .1s; } .pick:hover { transform:translateY(-2px); }
  .pick.on { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .pick.on::after { content:'✓'; position:absolute; top:12px; right:14px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:#2b1a00; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .counter { font-weight:900; color:var(--gold); }
  .result { background:rgba(14,6,32,.6); border:1px solid var(--line); border-radius:16px; padding:14px; } .result > * + * { margin-top:10px; }
  .regras { font-family:ui-monospace,Consolas,monospace; font-size:13.5px; background:rgba(10,4,26,.85); border-radius:10px; padding:8px 12px; color:#ffd166; }
  /* deck */
  .timer-bar { height:10px; background:rgba(14,6,32,.7); border-radius:8px; overflow:hidden; } .timer-fill { height:100%; width:100%; background:linear-gradient(90deg,var(--gold),var(--pink)); }
  .situation { background:var(--bg2); border:2px dashed var(--purple); border-radius:16px; padding:20px; font-size:18px; text-align:center; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .opt { border:none; border-radius:18px; padding:20px 12px; color:#fff; font-weight:900; font-size:16px; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.35); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .opt .e { font-size:30px; } .o0 { background:linear-gradient(160deg,#4ee08a,#1f9e5c); } .o1 { background:linear-gradient(160deg,#ff9f43,#d4541c); }
  .opt.correct { outline:4px solid #fff; animation:pop .4s; } .opt.wrong { opacity:.4; }
  .lightning { color:var(--gold); font-weight:900; }
  /* conserte */
  .vicio { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; font-size:13px; } .vicio span { background:rgba(14,6,32,.6); border:1px solid var(--line); border-radius:12px; padding:6px 10px; }
  .builder { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .slot { background:var(--bg2); border-radius:16px; padding:12px; } .slot > * + * { margin-top:8px; }
  select.input { padding:10px 12px; font-size:15px; }
  .rk { background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:10px 16px; max-width:420px; margin:0 auto; width:100%; }
  .rk h4 { margin:0 0 6px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:#b79ce8; text-align:center; }
  .rk .r { display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:14.5px; } .rk .r b { color:var(--gold); }
  .rk .me { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); text-align:center; font-weight:800; color:var(--gold); }
  .big { font-size:54px; font-weight:900; color:var(--gold); text-align:center; animation:pop .5s; }
  .decor img { position:fixed; pointer-events:none; z-index:0; filter:drop-shadow(0 10px 14px rgba(8,2,24,.55)); animation:bob 4.2s ease-in-out infinite; }
  .d1{left:1.5vw;bottom:3vh;height:126px} .d2{right:1.5vw;bottom:2vh;height:138px;animation-delay:.6s} .d3{left:2vw;top:14vh;height:96px;animation-delay:1.2s} .d4{right:2vw;top:13vh;height:96px;animation-delay:.3s}
  @media (max-width:1260px){ .d3,.d4{display:none;} .d1{height:88px;left:0} .d2{height:96px;right:0} }
  @media (max-width:760px){ .grid4{grid-template-columns:repeat(2,1fr);} .builder{grid-template-columns:1fr;} .card{padding:20px 14px;} .d1,.d2{display:none;} .head{align-items:flex-start;} .badge{max-width:32%;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div class="decor" aria-hidden="true">
  <img class="d1" src="/img/deco-pikachu.png" alt=""><img class="d2" src="/img/deco-charizard.png" alt="">
  <img class="d3" src="/img/deco-bulbasaur.png" alt=""><img class="d4" src="/img/deco-squirtle.png" alt="">
</div>
<div class="wrap" id="wrap">
  <div class="topbar"><span class="badge" id="nickBadge">Aula</span><span class="dchip" id="stageChip" style="display:none"></span><span class="badge score">⭐ <span id="score">0</span> pts</span></div>
  <div class="steps" id="steps"></div>
  <div class="card" id="app"></div>
</div>
<script>
const app = document.getElementById('app');
let me = JSON.parse(localStorage.getItem('aula_ia_me') || 'null');
let curStage = null, lastSeq = -1, timer = null, stageTimer = null, score = 0, routing = 0, lastIdx = -1;
const ORDER = [['misterio', 'Mistério'], ['pesquisa', 'Pesquisa'], ['treino', 'Treinador'], ['colou', 'Colou?'], ['conserte', 'Conserte']];
const MEMES = { lobby: 'spongebob', misterio: 'vulture', pesquisa: 'catsidewalk', treino: 'mrbean', colou: 'grinch', conserte: 'thinking', closed: 'catsniff' };
const TIPO_E = { 'Fogo': '🔥', 'Água': '💧', 'Planta': '🌿' };
const FUNDO_N = { vulcao: 'vulcão', mar: 'mar', grama: 'grama' };

const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (ms) => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const setScore = (n) => { score = n; document.getElementById('score').textContent = n; };
const addScore = (n) => setScore(score + (n || 0));
const clearTimer = () => { if (timer) { clearInterval(timer); timer = null; } };
const wide = (on) => document.getElementById('wrap').classList.toggle('wide', !!on);
const foto = (pk, fundo, extra = '') => `<div class="foto" style="background-image:url('/img/bg-${fundo}.jpg')"><img src="/img/pk-${pk}.png" alt="${esc(pk)}">${extra}</div>`;
const tipoTag = (t, cls = '') => `<span class="tag ${cls} t-${t}">${TIPO_E[t] || ''} ${t}</span>`;

function paintSteps(stage) {
  const i = ORDER.findIndex((o) => o[0] === stage); if (i >= 0) lastIdx = i;
  const reached = stage === 'final' ? ORDER.length : lastIdx;
  document.getElementById('steps').innerHTML = ORDER.map((o, k) => `<span class="step ${stage === 'final' || k < reached ? 'done' : k === i ? 'now' : ''}">${o[1]}</span>`).join('');
}
async function api(action, extra = {}) {
  const r = await fetch('/api/play', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, id: me && me.id, ...extra }) });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && j.error === 'unknown_player') { localStorage.removeItem('aula_ia_me'); me = null; showJoin(); throw new Error('reset'); }
  if (r.status === 409 && j.error === 'closed') { if (j.timeup) showTimeUp(j.stage); else route(j.stage); throw new Error('closed'); }
  if (!r.ok) throw new Error(j.error || 'erro');
  return j;
}
function stageChip(ms, stage) {
  const chip = document.getElementById('stageChip');
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  if (ms == null) { chip.style.display = 'none'; return; }
  chip.style.display = ''; const t0 = Date.now();
  const tick = () => {
    const left = Math.max(0, ms - (Date.now() - t0));
    chip.textContent = '⏱ ' + fmt(left); chip.classList.toggle('low', left < 15000);
    if (left <= 0) { clearInterval(stageTimer); stageTimer = null; chip.style.display = 'none'; if (curStage === stage && app.dataset.playing === stage) showTimeUp(stage); }
  };
  tick(); stageTimer = setInterval(tick, 250);
}
const playing = (stage) => { app.dataset.playing = stage; };

// ---------- entrada ----------
function showJoin(msg) {
  clearTimer(); stageChip(null); wide(false); playing(''); document.getElementById('nickBadge').textContent = 'Aula'; paintSteps('lobby');
  app.innerHTML = `
    <div class="qmark" style="margin:0 auto">?</div>
    <h2>A IA adora colar</h2>
    <p class="center">Escolha um apelido fictício para entrar. <strong>Nada de nome real!</strong></p>
    <input class="input" id="nick" maxlength="24" placeholder="Seu apelido" autocomplete="off">
    <div class="err" id="joinErr">${msg || ''}</div>
    <button class="btn" id="joinBtn">Entrar</button>`;
  const go = async () => {
    const nick = document.getElementById('nick').value; document.getElementById('joinBtn').disabled = true;
    try {
      const r = await fetch('/api/play', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'join', nick }) });
      const j = await r.json();
      if (!r.ok) { document.getElementById('joinErr').textContent = j.error || 'Erro ao entrar'; document.getElementById('joinBtn').disabled = false; return; }
      me = { id: j.id, nick: j.nick }; localStorage.setItem('aula_ia_me', JSON.stringify(me));
      document.getElementById('nickBadge').textContent = me.nick; setScore(0);
      fetch('/api/state').then((x) => x.json()).then((st) => { lastSeq = st.seq; route(st.stage); }).catch(() => route('lobby'));
    } catch { document.getElementById('joinErr').textContent = 'Sem conexão. Tente de novo.'; document.getElementById('joinBtn').disabled = false; }
  };
  document.getElementById('joinBtn').onclick = go;
  document.getElementById('nick').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

// ---------- espera / tempo esgotado ----------
async function showWait(kind, text) {
  clearTimer(); playing(''); wide(false);
  const t = text || (kind === 'lobby' ? 'Você está dentro! Aguarde a professora liberar a primeira etapa.' : kind === 'closed' ? 'Etapa encerrada! Aguarde a professora liberar a próxima.' : 'Aguarde a professora liberar.');
  app.innerHTML = `<img class="meme" src="/img/meme-${MEMES[kind] || 'spongebob'}.jpg" alt=""><h2>Aguarde a instrução</h2><p class="center">${t}</p><div id="rkBox"></div>`;
  if (kind !== 'closed') return;
  try {
    const r = await api('ranking'); if (curStage !== 'closed' || !r.top.length) return;
    const md = ['🥇', '🥈', '🥉', '4º', '5º'];
    document.getElementById('rkBox').innerHTML = `<div class="rk"><h4>🏆 Ranking da turma</h4>${r.top.map((x, i) => `<div class="r"><span>${md[i]} ${esc(x.nick)}</span><b>${x.total}</b></div>`).join('')}${r.me ? `<div class="me">Você está em ${r.me.rank}º de ${r.count} · ${r.myTotal} pts</div>` : ''}</div>`;
  } catch {}
}
const waitDone = (stage) => showWait(stage, 'Você terminou esta etapa! Aguarde a professora liberar a próxima.');
function showTimeUp(stage) {
  clearTimer(); playing(''); wide(false);
  app.innerHTML = `<img class="meme" src="/img/meme-catsniff.jpg" alt=""><h2>⏱️ Tempo esgotado!</h2><p class="center">Aguarde a professora liberar a próxima etapa.</p>`;
}

// ---------- roteamento ----------
async function route(stage) {
  const mine = ++routing;
  if (!me) return showJoin();
  curStage = stage; clearTimer(); stageChip(null); paintSteps(stage); playing(''); wide(false);
  if (stage === 'lobby' || stage === 'closed') return showWait(stage);
  try {
    if (stage === 'final') return await showFinal();
    const d = await api('enter', { stage });
    if (mine !== routing) return;
    api('me').then((m) => setScore(m.total)).catch(() => {});
    if (d.done) return waitDone(stage);
    if (d.remainingMs === 0) return showTimeUp(stage);
    stageChip(d.remainingMs, stage); playing(stage);
    ({ misterio: showMisterio, pesquisa: showPesquisa, treino: showTreino, colou: runColou, conserte: showConserte })[stage](d);
  } catch (e) { /* closed/reset já tratados */ }
}

// ---------- 1) Mistério: a Pokédex que errou ----------
function showMisterio(d) {
  wide(true);
  const marks = d.cards.map(() => null); const pistas = new Set();
  app.innerHTML = `
    <div class="head"><div class="qmark">?</div><div><h2>A Pokédex que errou</h2><p>Esta Pokédex usa IA pra dizer o <b>tipo</b> do Pokémon pela foto. Confira na <b>ficha da PokéAPI</b> e marque se ela acertou ou errou.</p></div></div>
    <div class="grid4 compact">${d.cards.map((c, i) => `
      <div class="pcard" id="pc${i}">
        ${foto(c.pk, c.fundo, `<span class="tag">🤖 IA: ${TIPO_E[c.guess]} ${c.guess}</span>`)}
        <div class="nm">${esc(c.nome)}</div>
        <button class="ficha" data-i="${i}">📄 ver ficha na PokéAPI</button>
        <div class="seg"><button class="y" data-i="${i}" data-v="1">✅ Acertou</button><button class="n" data-i="${i}" data-v="0">❌ Errou</button></div>
      </div>`).join('')}</div>
    <p class="center"><b>Agora o mistério:</b> o que a IA estava olhando pra decidir? <span class="muted">(pode marcar mais de um)</span></p>
    <div class="chips" id="pistas">${d.pistas.map((x) => `<button class="chip" data-p="${x}">${{ forma: '🔺 forma do Pokémon', cor: '🎨 cor', fundo: '🏞️ fundo da foto', tamanho: '📏 tamanho' }[x] || x}</button>`).join('')}</div>
    <div id="fb"></div>
    <button class="btn" id="send">Enviar minha investigação</button>`;
  app.querySelectorAll('.ficha').forEach((b) => b.onclick = () => { const c = d.cards[b.dataset.i]; b.classList.add('open'); b.textContent = `📄 tipo real: ${TIPO_E[c.real]} ${c.real}`; });
  app.querySelectorAll('.seg button').forEach((b) => b.onclick = () => {
    const i = Number(b.dataset.i); marks[i] = b.dataset.v === '1';
    b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  });
  app.querySelectorAll('#pistas .chip').forEach((b) => b.onclick = () => { const p = b.dataset.p; pistas.has(p) ? pistas.delete(p) : pistas.add(p); b.classList.toggle('on', pistas.has(p)); });
  document.getElementById('send').onclick = async () => {
    const fb = document.getElementById('fb');
    if (marks.some((m) => m === null)) { fb.innerHTML = `<div class="fb no">Marque ✅ ou ❌ em todas as ${marks.length} fotos!</div>`; return; }
    try {
      const r = await api('misterio_submit', { marks, pistas: [...pistas] });
      playing(''); document.getElementById('send').disabled = true; addScore(r.points);
      r.certo.forEach((ok, i) => document.getElementById('pc' + i).classList.add(marks[i] === ok ? 'right' : 'wrong'));
      fb.innerHTML = `<div class="fb ok">+${r.points} pontos · você julgou certo ${r.marcasOk} de ${r.total} fotos</div>` +
        `<div class="fb ${r.pistaCompleta ? 'ok' : 'info'}" style="margin-top:8px">${r.pistaCompleta ? '🕵️ Mistério resolvido: a IA estava colando pela <b>cor</b> E pelo <b>fundo</b>!' : '🤔 Quase! Repare no Magikarp (laranja) e no Charmander no mar… a IA olhava duas coisas.'}</div>`;
      setTimeout(() => { if (curStage === 'misterio') waitDone('misterio'); }, 6000);
    } catch (e) { if (!['closed', 'reset'].includes(e.message)) fb.innerHTML = `<div class="fb no">${esc(e.message)}</div>`; }
  };
}

// ---------- 3) Pesquisa no artigo ----------
function showPesquisa(d) {
  app.innerHTML = `
    <h2>📄 Pesquisa: o que a ciência diz?</h2>
    <p class="center">Leia o <b>resumo</b> e a <b>Figura 1</b> do artigo e responda (em português ou inglês).</p>
    <div class="fb info" style="font-weight:600">${esc(d.citacao)}<br><span class="muted">Revista com JCR · link aberto (versão do arXiv)</span></div>
    <div class="center"><a class="link-btn" href="${d.url}" target="_blank" rel="noopener">🔗 Abrir o artigo</a></div>
    ${d.prompts.map((q, i) => `<div class="slot" id="q${i}"><p style="color:#fff;font-size:15px">${i + 1}. ${esc(q)}</p><form class="row" data-i="${i}"><input class="input" maxlength="80" placeholder="Sua resposta" ${d.answered[i] ? 'disabled value="✅ respondida"' : ''}><button class="btn" ${d.answered[i] ? 'disabled' : ''}>Enviar</button></form><div class="fbz"></div></div>`).join('')}`;
  app.querySelectorAll('form').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault(); const i = Number(f.dataset.i); const inp = f.querySelector('input'); if (!inp.value.trim()) return;
    const box = f.parentElement.querySelector('.fbz');
    try {
      const r = await api('pesquisa_answer', { qi: i, text: inp.value });
      if (r.correct) { if (!r.already) addScore(r.points); inp.disabled = true; f.querySelector('button').disabled = true; box.innerHTML = `<div class="fb ok">✅ Isso! +${r.points || 0} pontos</div>`; if (r.allDone) { playing(''); setTimeout(() => { if (curStage === 'pesquisa') waitDone('pesquisa'); }, 1800); } }
      else box.innerHTML = `<div class="fb no" style="animation:shake .4s">Ainda não… olhe de novo no artigo!</div>`;
    } catch {}
  });
}

// ---------- 4) Treinador da Pokédex ----------
function showTreino(d) {
  wide(true);
  const sel = new Set();
  app.innerHTML = `
    <div class="head"><div class="qmark">🎓</div><div><h2>Treinador da Pokédex</h2><p>Escolha <b>${d.escolher} fotos</b> para ensinar a IA. Depois ela faz uma prova com 4 fotos que <b>nunca viu</b>. Consegue fazer ela acertar todas?</p></div></div>
    <div class="grid4" id="pool">${d.pool.map((c) => `<div class="pcard pick" data-id="${c.id}">${foto(c.pk, c.fundo, tipoTag(c.tipo))}<div class="nm">${esc(c.nome)} <span class="muted">· ${c.cor}</span></div></div>`).join('')}</div>
    <div class="btnrow"><span class="counter" id="cnt">0/${d.escolher} escolhidas</span><button class="btn" id="train" disabled>🧠 Treinar a IA</button></div>
    <div id="out"></div>`;
  const cnt = document.getElementById('cnt'), train = document.getElementById('train');
  const upd = () => { cnt.textContent = `${sel.size}/${d.escolher} escolhidas`; train.disabled = sel.size !== d.escolher; };
  app.querySelectorAll('.pick').forEach((el) => el.onclick = () => {
    const id = el.dataset.id;
    if (sel.has(id)) sel.delete(id); else if (sel.size < d.escolher) sel.add(id);
    el.classList.toggle('on', sel.has(id)); upd();
  });
  if (d.tentativas) document.getElementById('out').innerHTML = `<p class="muted">Tentativas até agora: ${d.tentativas} · melhor nota: ${d.melhor}/4</p>`;
  train.onclick = async () => {
    train.disabled = true;
    try {
      const r = await api('treino_train', { ids: [...sel] });
      setScore(score - 0); api('me').then((m) => setScore(m.total)).catch(() => {});
      const motivo = (x) => x.por === 'cor' ? 'colou pela cor' : x.por === 'fundo' ? 'colou pelo fundo' : x.por === 'nunca-viu' ? 'nunca viu esse tipo' : 'olhou o Pokémon';
      document.getElementById('out').innerHTML = `
        <div class="result">
          <h3>${r.acertos === 4 ? '🎉 4/4! Sua IA aprendeu de verdade!' : `📝 Nota da IA: ${r.acertos}/4`}</h3>
          ${r.regras.length ? `<p style="font-size:14.5px">Sua IA aprendeu estes <b>atalhos</b>:</p><div class="regras">${r.regras.map(esc).join('<br>')}</div>` : `<p style="font-size:14.5px">Nenhum atalho funcionava nos seus exemplos, então ela teve que aprender <b>o Pokémon</b>. 💜</p>`}
          <div class="grid4">${r.prova.map((x) => `<div class="pcard ${x.ok ? 'right' : 'wrong'}">${foto(x.pk, x.fundo, `<span class="tag">🤖 ${TIPO_E[x.palpite] || ''} ${esc(x.palpite)}</span><span class="tag r">${x.ok ? '✅' : '❌'}</span>`)}<div class="nm">${esc(x.nome)} <span class="muted">· ${motivo(x)}</span></div></div>`).join('')}</div>
          <p class="muted">${r.done ? 'Etapa concluída!' : `Tentativa ${r.tentativas} · melhor nota ${r.melhor}/4 · ${r.points} pts. Troque as fotos e treine de novo!`}</p>
          ${r.done ? '' : '<div class="btnrow"><button class="btn ghost" id="stop">Já está bom, terminar</button></div>'}
        </div>`;
      document.getElementById('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (r.done) { playing(''); setTimeout(() => { if (curStage === 'treino') waitDone('treino'); }, 5000); }
      else document.getElementById('stop').onclick = async () => { try { await api('treino_done'); playing(''); waitDone('treino'); } catch {} };
      upd();
    } catch (e) { if (!['closed', 'reset'].includes(e.message)) document.getElementById('out').innerHTML = `<div class="fb no">${esc(e.message)}</div>`; upd(); }
  };
}

// ---------- 5) Aprendeu ou colou? ----------
async function runColou() {
  let n; try { n = await api('colou_next'); } catch { return; }
  if (n.done) { playing(''); return waitDone('colou'); }
  app.innerHTML = `
    <h2>${n.bonus ? '<span class="lightning">⚡ Rodada Relâmpago (vale dobrado)</span>' : `🕵️ Aprendeu ou colou? ${n.index + 1} de ${n.total}`}</h2>
    <div class="timer-bar"><div class="timer-fill" id="bar"></div></div>
    <div class="situation">${esc(n.q)}</div>
    <div class="two" id="opts"><button class="opt o0" data-i="0"><span class="e">🧠</span>${esc(n.opts[0])}</button><button class="opt o1" data-i="1"><span class="e">📝</span>${esc(n.opts[1])}</button></div>
    <div id="fb"></div>`;
  let answered = false;
  const send = async (choice) => {
    if (answered) return; answered = true; clearTimer();
    app.querySelectorAll('#opts button').forEach((b) => b.disabled = true);
    try {
      const r = await api('colou_answer', { choice });
      const btns = app.querySelectorAll('#opts button'); btns[r.correctIndex].classList.add('correct'); if (!r.correct && choice >= 0) btns[choice].classList.add('wrong');
      addScore(r.points);
      document.getElementById('fb').innerHTML = r.correct ? `<div class="fb ok">✅ Isso mesmo! +${r.points} pontos<br><span style="font-weight:400">${esc(r.why)}</span></div>` : `<div class="fb no">${choice < 0 || r.timedOut ? '⏱️ Tempo esgotado!' : '❌ Quase!'}<br><span style="font-weight:400">${esc(r.why)}</span></div>`;
      setTimeout(() => { if (curStage === 'colou') runColou(); }, 2000);
    } catch {}
  };
  app.querySelectorAll('#opts button').forEach((b) => b.onclick = () => send(Number(b.dataset.i)));
  const bar = document.getElementById('bar'); const ms = n.remainingMs; const t0 = Date.now();
  clearTimer(); timer = setInterval(() => { const left = Math.max(0, ms - (Date.now() - t0)); bar.style.width = (left / 10000 * 100) + '%'; if (left <= 0) { clearTimer(); send(-1); } }, 100);
}

// ---------- 6) Conserte a Pokédex ----------
function showConserte(d) {
  const ex = [{ pk: '', fundo: '' }, { pk: '', fundo: '' }];
  const opt = d.pokemon.map((p) => `<option value="${p.pk}">${p.nome} (${p.tipo}, ${p.cor})</option>`).join('');
  app.innerHTML = `
    <h2>🛠️ Conserte a Pokédex</h2>
    <p class="center">A Pokédex original foi treinada <b>só</b> com fotos assim:</p>
    <div class="vicio"><span>🔥 Fogo: laranja, no vulcão</span><span>💧 Água: azul, no mar</span><span>🌿 Planta: verde, na grama</span></div>
    <p class="center">Crie <b>${d.exemplos} fotos novas</b> pro treino que <b>quebrem os atalhos</b> dela. Suas ideias vão pro <b>mural da turma</b>!</p>
    <div class="builder">${ex.map((_, i) => `
      <div class="slot"><h3>Exemplo ${i + 1}</h3>
        <select class="input" data-i="${i}"><option value="">Escolha o Pokémon…</option>${opt}</select>
        <div class="chips" data-i="${i}">${Object.entries(d.fundos).map(([k, v]) => `<button class="chip" data-f="${k}">${{ vulcao: '🌋', mar: '🌊', grama: '🌱' }[k]} ${v}</button>`).join('')}</div>
        <div class="pv" id="pv${i}"></div>
      </div>`).join('')}</div>
    <input class="input" id="frase" maxlength="160" placeholder="Em uma frase: por que esses exemplos ajudam a IA?">
    <div id="fb"></div>
    <button class="btn" id="send">📌 Enviar para o mural</button>`;
  const prev = (i) => { const e = ex[i]; document.getElementById('pv' + i).innerHTML = e.pk && e.fundo ? foto(e.pk, e.fundo) : '<p class="muted">Escolha o Pokémon e o fundo pra ver a foto.</p>'; };
  [0, 1].forEach(prev);
  app.querySelectorAll('select').forEach((s) => s.onchange = () => { ex[s.dataset.i].pk = s.value; prev(Number(s.dataset.i)); });
  app.querySelectorAll('.builder .chips').forEach((g) => g.querySelectorAll('.chip').forEach((b) => b.onclick = () => {
    const i = Number(g.dataset.i); ex[i].fundo = b.dataset.f; g.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); prev(i);
  }));
  document.getElementById('send').onclick = async () => {
    const fb = document.getElementById('fb');
    if (ex.some((e) => !e.pk || !e.fundo)) { fb.innerHTML = '<div class="fb no">Monte os 2 exemplos (Pokémon + fundo)!</div>'; return; }
    try {
      const r = await api('conserte_submit', { ex, frase: document.getElementById('frase').value });
      playing(''); document.getElementById('send').disabled = true; addScore(r.points);
      fb.innerHTML = `<div class="fb ok">📌 No mural! +${r.points} pontos</div>
        <div class="fb ${r.quebraCor ? 'ok' : 'no'}" style="margin-top:8px">${r.quebraCor ? '✅ Quebrou o atalho da COR' : '❌ Não quebrou o atalho da cor (dica: um Pokémon com a cor "errada" pro tipo)'}</div>
        <div class="fb ${r.quebraFundo ? 'ok' : 'no'}" style="margin-top:8px">${r.quebraFundo ? '✅ Quebrou o atalho do FUNDO' : '❌ Não quebrou o atalho do fundo (dica: um Pokémon num fundo "errado" pro tipo)'}</div>`;
      setTimeout(() => { if (curStage === 'conserte') waitDone('conserte'); }, 6000);
    } catch (e) { if (!['closed', 'reset'].includes(e.message)) fb.innerHTML = `<div class="fb no">${esc(e.message)}</div>`; }
  };
}

// ---------- final ----------
async function showFinal() {
  const f = await api('final'); setScore(f.total);
  app.innerHTML = `
    <img src="/img/espeon.png" alt="" style="height:130px;display:block;margin:0 auto;animation:bob 3s ease-in-out infinite">
    <h2>🏆 A Pokédex aprendeu!</h2>
    <div class="big">${f.total} pts</div>
    <p class="center">Você ficou em <strong>${f.rank}º lugar</strong> de ${f.count}.</p>
    <p class="center" style="color:var(--gold);font-weight:700">A API traz os dados, a IA aprende com eles… e dado ruim gera IA que cola.</p>
    <p class="muted">Obrigada por participar! 💜</p>`;
}

// ---------- polling ----------
async function poll() {
  try { const r = await fetch('/api/state'); const s = await r.json(); if (me && (s.seq !== lastSeq || s.stage !== curStage)) { lastSeq = s.seq; route(s.stage); } } catch {}
  setTimeout(poll, 2300 + Math.random() * 900);
}
paintSteps('lobby');
if (me) { document.getElementById('nickBadge').textContent = me.nick; api('me').then((m) => setScore(m.total)).catch(() => {}); } else showJoin();
poll();
</script>
