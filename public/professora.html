<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da professora · Da API à IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e1b; --panel:#12162a; --card:#1a1f38; --line:#2a3156; --ink:#eef0fb; --soft:#b9bfe0; --mute:#828ab4; --acc:#8b7cff; --acc2:#5b8cff; --ok:#3dd6a5; --no:#ff6b81; --warn:#ffc65c; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:84px; }
  .shell { max-width:1100px; margin:0 auto; padding:16px 20px; min-height:calc(100vh - 84px); display:flex; flex-direction:column; justify-content:center; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; font-size:12px; font-weight:600; color:var(--mute); }
  .badge { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 13px; }
  .status { border-color:var(--ok); color:var(--ok); } .status.off { color:var(--mute); } .status.bad { border-color:var(--no); color:var(--no); }
  .panel { position:relative; background:radial-gradient(900px 500px at 0% 0%,rgba(139,124,255,.14),transparent 60%),radial-gradient(700px 400px at 100% 100%,rgba(91,140,255,.10),transparent 60%),var(--panel); border:1px solid var(--line); border-radius:22px; overflow-y:auto; overflow-x:hidden; width:100%; aspect-ratio:16/9; box-shadow:0 24px 60px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  @media (max-width:760px){ .panel{ aspect-ratio:auto; min-height:560px; } }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  @keyframes pop { 0%{transform:scale(.9);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .page { width:100%; height:100%; animation:fadeUp .4s ease-out; display:flex; align-items:center; justify-content:center; }
  .hero { display:flex; width:100%; align-items:center; justify-content:center; gap:36px; padding:30px 48px; }
  .hero-text { flex:1 1 520px; max-width:560px; display:flex; flex-direction:column; } .hero-text > * + * { margin-top:14px; }
  .hero-side { flex:0 1 360px; }
  .cc { width:100%; max-width:900px; padding:24px 40px; text-align:center; display:flex; flex-direction:column; align-items:center; } .cc > * + * { margin-top:13px; }
  @media (max-width:760px){ .hero{flex-direction:column; padding:22px 18px;} .cc{padding:20px 16px;} }
  .eyebrow { font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--acc); font-weight:700; }
  h1 { font-size:34px; margin:0; line-height:1.15; letter-spacing:-.02em; } .accent { color:var(--acc); }
  h2 { font-size:25px; margin:0; letter-spacing:-.01em; } h3 { margin:0; font-size:15.5px; }
  p { line-height:1.55; font-size:16.5px; color:var(--soft); margin:0; } b, strong { color:var(--ink); }
  .muted { color:var(--mute); font-size:13px; }
  .q { font-size:19px; font-weight:700; color:var(--ink); background:rgba(139,124,255,.1); border-left:3px solid var(--acc); padding:12px 16px; border-radius:8px; text-align:left; }
  .name-tag { font-weight:700; color:var(--acc); }
  .btn-cta { background:var(--acc); color:#fff; border:none; border-radius:12px; padding:13px 26px; font:inherit; font-size:16.5px; font-weight:700; cursor:pointer; }
  .link-btn { display:inline-block; background:var(--card); color:var(--soft); border:1px solid var(--line); border-radius:10px; padding:9px 15px; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; font-size:14px; }
  .live { color:var(--ok); font-weight:700; font-size:16.5px; margin-bottom:8px; } .tchip { margin-left:10px; color:var(--warn); font-weight:800; font-variant-numeric:tabular-nums; }
  .btns2 { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .joinbox { background:var(--card); border:1px dashed var(--acc); border-radius:12px; padding:10px 14px; font-size:15px; text-align:left; } .joinbox b { color:var(--warn); font-size:18px; word-break:break-all; }
  .bloom { display:flex; flex-direction:column; gap:7px; text-align:left; }
  .bl { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:15px; color:var(--soft); }
  .bl b.lv { flex:none; min-width:88px; border-radius:999px; padding:3px 10px; font-size:11.5px; text-align:center; letter-spacing:.05em; background:#262d52; color:var(--soft); }
  .bl.meta { border-color:var(--acc); } .bl.meta b.lv { background:var(--acc); color:#fff; }
  .timeline { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .tl { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 6px; font-size:12px; text-align:center; color:var(--soft); } .tl b { display:block; font-size:12.5px; color:var(--ink); } .tl.th { border-style:dashed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; text-align:left; } .card > * + * { margin-top:6px; }
  .card.hl { border-color:var(--acc); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; text-align:left; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; }
  .ph { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; background:#0b0e1c; border:1px solid var(--line); }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .tag { position:absolute; top:6px; left:6px; font-size:12px; font-weight:700; padding:3px 8px; border-radius:8px; color:#fff; background:rgba(10,12,26,.85); }
  .tag.r { left:auto; right:6px; }
  .foto { position:relative; aspect-ratio:4/3; border-radius:10px; background-size:cover; background-position:center; overflow:hidden; border:1px solid var(--line); }
  .foto img { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); height:70%; max-width:85%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .strip6 { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; width:100%; max-width:760px; }
  .cycle { display:flex; align-items:stretch; gap:8px; width:100%; }
  .cs { flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 10px; font-size:13.5px; color:var(--soft); } .cs b { display:block; color:var(--ink); font-size:15px; margin:4px 0; } .cs .ic { font-size:24px; }
  .cs.hl { border-color:var(--acc); background:rgba(139,124,255,.12); }
  .arr { align-self:center; color:var(--acc); font-size:22px; font-weight:800; }
  .code { font-family:ui-monospace,Consolas,monospace; font-size:13.5px; background:#0b0e1c; border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:#c9d1ff; text-align:left; line-height:1.55; white-space:pre; }
  .code .k { color:#8b7cff; } .code .s { color:#3dd6a5; }
  .optrow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; } .optrow div { border-radius:12px; padding:12px 16px; font-weight:700; background:var(--card); border:1px solid var(--line); }
  .rank-wrap { display:flex; gap:28px; width:100%; max-width:980px; padding:24px 40px; align-items:stretch; }
  .rank-col { flex:1; min-width:0; } .rank-col h2 { margin-bottom:10px; }
  .rrow { display:flex; align-items:center; gap:10px; margin:8px 0; animation:pop .35s backwards; }
  .rrow .pos { width:34px; font-size:20px; text-align:center; } .rrow .nick { width:150px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .bar { flex:1; background:var(--card); border-radius:8px; overflow:hidden; height:20px; } .rrow .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:8px; }
  .rrow .pts { width:60px; text-align:right; font-weight:800; color:var(--warn); }
  .pbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:9px; font-size:14px; color:var(--soft); } .pbox b { color:var(--warn); }
  .mbar { display:grid; grid-template-columns:minmax(120px,1.6fr) 2fr 30px; gap:8px; align-items:center; margin:5px 0; font-size:13px; text-align:left; } .mbar .t { background:#0b0e1c; border-radius:6px; height:12px; overflow:hidden; } .mbar .t i { display:block; height:100%; background:var(--acc); } .mbar.good .t i { background:var(--ok); } .mbar.bad .t i { background:var(--no); } .mbar b { color:var(--ink); }
  .mural { width:100%; max-width:1020px; padding:20px 28px; align-self:stretch; display:flex; flex-direction:column; text-align:center; }
  .mural-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; text-align:left; }
  .mural-split { display:grid; grid-template-columns:1.1fr 1fr; gap:18px; margin-top:12px; text-align:left; } .mural-split .mural-grid { grid-template-columns:1fr; margin-top:0; max-height:52vh; overflow:auto; }
  @media (max-width:760px){ .mural-grid, .mural-split { grid-template-columns:1fr; } .rank-wrap{flex-direction:column; padding:20px 16px;} .two, .three{grid-template-columns:1fr;} .cycle{flex-direction:column;} .arr{transform:rotate(90deg);} .timeline{grid-template-columns:repeat(3,1fr);} .strip6{grid-template-columns:repeat(3,1fr);} }
  .note { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; animation:pop .3s backwards; } .note .who { font-weight:700; font-size:12.5px; color:var(--acc); } .note .fr { font-size:14px; color:var(--ink); margin-top:4px; line-height:1.45; }
  .ref { font-size:12.5px; color:var(--mute); text-align:left; line-height:1.5; }
  .navbar { position:fixed; bottom:0; left:0; right:0; z-index:50; background:#0a0d19; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px)); gap:10px; }
  .nav-btn { background:var(--panel); color:var(--soft); border:1px solid var(--line); border-radius:10px; padding:10px 20px; font:inherit; font-weight:600; font-size:14px; cursor:pointer; }
  .nav-btn:disabled { opacity:.3; cursor:default; } .nav-btn.primary { background:var(--acc); color:#fff; border:none; }
  .dot { font-size:12px; color:var(--mute); font-weight:600; }
  .menu { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; display:none; flex-direction:column; gap:8px; z-index:60; min-width:260px; } .menu.open { display:flex; }
  .overlay { position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; } .overlay .box2 { width:92%; max-width:360px; text-align:center; } .overlay .box2 > * + * { margin-top:14px; }
  .input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-size:16px; }
  .err { color:var(--no); font-size:14px; min-height:18px; }
</style>
</head>
<body>
<div class="overlay" id="login"><div class="box2">
  <h2>🔐 Painel da professora</h2>
  <input class="input" id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="btn-cta" id="loginBtn">Entrar</button>
</div></div>

<div class="shell">
  <div class="topbar">
    <span class="badge">Educação em Computação • Unesp • 2026</span>
    <span class="badge status off" id="statusChip">conectando…</span>
    <span class="badge" id="bloomBadge">Bloom: —</span>
  </div>
  <div class="panel" id="app"></div>
</div>
<div class="menu" id="menu">
  <button class="link-btn" onclick="closeStage()">⏹ Encerrar etapa agora</button>
  <button class="link-btn" style="border-color:var(--no);color:var(--no)" onclick="resetAula()">🗑 Reiniciar aula (apaga jogadores)</button>
</div>
<div class="navbar">
  <button class="nav-btn" id="backBtn" onclick="navBack()">← Voltar</button>
  <span class="dot" id="dot">1/9</span>
  <button class="nav-btn" onclick="document.getElementById('menu').classList.toggle('open')">⚙</button>
  <button class="nav-btn primary" id="nextBtn" onclick="navNext()">Avançar →</button>
</div>

<script>
const IMG = (n) => '/img/' + n;
const app = document.getElementById('app');
let PW = sessionStorage.getItem('aula_ia2_pw') || '';
let status = null, idx = 0, renderToken = 0, clockOffset = 0, muralTimer = null;
const ACTIVE = ['detetive', 'pesquisa', 'treino', 'auditoria', 'plano'];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STAGE_NAME = { lobby: 'Sala de espera', detetive: 'Detetive', pesquisa: 'Pesquisa', treino: 'Treinador', auditoria: 'Auditoria', plano: 'Plano de dados', closed: 'Etapa encerrada', final: 'Finalização' };
const foto = (pk, fundo, tag = '') => `<div class="foto" style="background-image:url('${IMG('bg-' + fundo + '.jpg')}')"><img src="${IMG('pk-' + pk + '.png')}" alt="">${tag}</div>`;
const real = (id, tag = '', heat = false) => `<div class="ph"><img src="${IMG('real/' + id + (heat ? '-heat' : '') + '.jpg')}" alt="">${tag}</div>`;

async function H(action, extra = {}) {
  const r = await fetch('/api/host', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: PW, action, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'erro');
  return j;
}
async function pollStatus() {
  const chip = document.getElementById('statusChip');
  try {
    status = await H('board', { top: 1 });
    clockOffset = (status.serverNow || Date.now()) - Date.now();
    const active = ACTIVE.includes(status.stage);
    chip.className = 'badge status' + (active ? '' : ' off');
    chip.textContent = `${active ? '🔓 ' : ''}${STAGE_NAME[status.stage] || status.stage} · 👥 ${status.count}` + (active ? ` · ✅ ${status.doneNow}/${status.count}` : '');
    paintUnlock(); const jc = document.getElementById('joinCount'); if (jc) jc.textContent = status.count;
  } catch (e) { chip.className = 'badge status bad'; chip.textContent = '⚠ ' + e.message; }
}
function tickTimer() {
  const c = document.getElementById('tchip'); if (!c || !status || !status.deadline) return;
  const left = Math.max(0, status.deadline - (Date.now() + clockOffset)); const t = Math.ceil(left / 1000);
  c.textContent = left > 0 ? '⏱ ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') : '⏱ tempo esgotado';
}
setInterval(tickTimer, 500);
function paintUnlock() {
  document.querySelectorAll('.unlock').forEach((z) => {
    if (!status) return;
    if (status.stage === z.dataset.stage) {
      z.innerHTML = `<div class="live">✅ Liberado: ${status.doneNow}/${status.count} concluíram${status.deadline ? '<span class="tchip" id="tchip"></span>' : ''}</div><div class="btns2">${status.deadline ? '<button class="link-btn" onclick="extendStage()">+30s</button>' : ''}<button class="link-btn" onclick="closeStage()">Encerrar etapa</button></div>`;
      tickTimer();
    } else if (!z.querySelector('button.btn-cta')) z.innerHTML = `<button class="btn-cta" onclick="unlock('${z.dataset.stage}')">🔓 ${z.dataset.label}</button>`;
  });
}
const unlockZone = (stage, label) => `<div class="unlock" data-stage="${stage}" data-label="${label}"><button class="btn-cta" onclick="unlock('${stage}')">🔓 ${label}</button></div>`;
async function unlock(stage) { try { await H('setStage', { stage }); await pollStatus(); } catch (e) { alert(e.message); } }
async function extendStage() { try { await H('extend', { ms: 30000 }); await pollStatus(); } catch (e) { alert(e.message); } }
async function closeStage() { document.getElementById('menu').classList.remove('open'); try { await H('setStage', { stage: 'closed' }); await pollStatus(); } catch (e) { alert(e.message); } }
async function resetAula() {
  document.getElementById('menu').classList.remove('open');
  if (!confirm('Apagar todos os jogadores e voltar para a sala de espera?')) return;
  try { await H('reset'); await pollStatus(); } catch (e) { alert(e.message); }
}

// ================== PÁGINAS ==================
const pages = [
  { num: 1, bloom: '—', render: pAbertura },
  { num: 2, bloom: 'meta: Analisar', render: pObjetivos },
  { num: 3, bloom: 'Analisar', render: pIntroDetetive },
  { num: null, bloom: 'Analisar', render: () => pRanking('Ranking: Detetive de dados', 'detetive', 'closed') },
  { num: 4, bloom: 'Entender', render: pExplicacao1, closeOnEnter: true },
  { num: 4, bloom: 'Entender', render: pExplicacao2 },
  { num: 5, bloom: 'Analisar', render: pIntroPesquisa },
  { num: null, bloom: 'Analisar', render: pMuralPesquisa },
  { num: 6, bloom: 'Aplicar', render: pIntroTreino, closeOnEnter: true },
  { num: null, bloom: 'Aplicar', render: () => pRanking('Ranking: Treinador', 'treino', 'closed') },
  { num: 7, bloom: 'Analisar', render: pIntroAuditoria },
  { num: null, bloom: 'Analisar', render: () => pRanking('Ranking: Auditoria', null, 'closed') },
  { num: 8, bloom: 'Criar', render: pIntroPlano },
  { num: null, bloom: 'Criar', render: pMuralPlano },
  { num: null, bloom: 'Concluído ✓', render: () => pRanking('🏆 Ranking final', null, 'final') },
  { num: 9, bloom: 'Concluído ✓', render: pFinal },
];
function render() {
  const p = pages[idx];
  if (muralTimer) { clearInterval(muralTimer); muralTimer = null; }
  document.getElementById('bloomBadge').textContent = 'Bloom: ' + p.bloom;
  document.getElementById('dot').textContent = p.num ? p.num + '/9' : '📊 painel';
  document.getElementById('backBtn').disabled = idx === 0;
  document.getElementById('nextBtn').style.visibility = idx === pages.length - 1 ? 'hidden' : 'visible';
  renderToken++; p.render(); paintUnlock();
  const jc = document.getElementById('joinCount'); if (jc && status) jc.textContent = status.count;
  if (p.closeOnEnter && status && ACTIVE.includes(status.stage)) H('setStage', { stage: 'closed' }).then(pollStatus).catch(() => {});
}
function navBack() { if (idx > 0) { idx--; render(); } }
function navNext() { if (idx < pages.length - 1) { idx++; render(); } }
document.addEventListener('keydown', (e) => { if (document.getElementById('login').style.display !== 'none' || ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return; if (e.key === 'ArrowRight') navNext(); if (e.key === 'ArrowLeft') navBack(); });
const show = (html) => { app.innerHTML = `<div class="page">${html}</div>`; };

function pAbertura() {
  show(`<div class="hero"><div class="hero-text">
      <div class="eyebrow">Da API à IA</div>
      <h1>Na aula passada vocês <span class="accent">pediram</span> dados a uma API. Hoje esses dados vão <span class="accent">ensinar</span> uma IA.</h1>
      <p>Uma API devolve dados em JSON. Muitas IAs são treinadas com milhares de respostas assim: uma imagem e um <b>rótulo</b>.</p>
      <div class="q">Uma IA que acerta 97% dos testes está pronta para ser usada num posto de saúde?</div>
      <span class="muted">Apresentado por <span class="name-tag">Mayara Karen M. Pereira</span></span>
    </div><div class="hero-side"><div class="code"><span class="muted">// resposta simplificada</span>
GET /api/v2/pokemon/charmander
{
  <span class="k">"name"</span>: <span class="s">"charmander"</span>,
  <span class="k">"types"</span>: [<span class="s">"fire"</span>],
  <span class="k">"sprite"</span>: <span class="s">"charmander.png"</span>
}

<span class="muted">imagem + rótulo = exemplo de treino</span></div></div></div>`);
}
function pObjetivos() {
  show(`<div class="hero" style="align-items:flex-start"><div class="hero-text" style="max-width:620px">
      <div class="eyebrow">Objetivos · Taxonomia de Bloom revisada</div>
      <h2>Ao final da aula, você será capaz de:</h2>
      <div class="bloom">
        <div class="bl"><b class="lv">ENTENDER</b><span>Explicar como uma IA aprende a classificar imagens a partir de dados de treino.</span></div>
        <div class="bl meta"><b class="lv">ANALISAR</b><span><b>Meta da aula:</b> diagnosticar por que uma IA erra, distinguindo <b>atalho</b> de <b>falta de representatividade</b>.</span></div>
        <div class="bl"><b class="lv">APLICAR</b><span>Montar um conjunto de treino e prever o resultado da IA.</span></div>
        <div class="bl"><b class="lv">CRIAR</b><span>Propor um plano de dados para uma IA usada no Brasil.</span></div>
      </div>
      <div class="timeline">
        <div class="tl"><b>1 · Detetive</b>3:30</div><div class="tl th"><b>2 · Explicação</b>3:00</div><div class="tl"><b>3 · Pesquisa</b>4:00</div>
        <div class="tl"><b>4 · Treinador</b>4:00</div><div class="tl"><b>5 · Auditoria</b>2:00</div><div class="tl"><b>6 · Plano</b>2:30</div>
      </div>
    </div><div class="hero-side" style="align-self:center"><div class="joinbox">Entrem em:<br><b>${location.origin}</b><br><span class="muted">👥 <span id="joinCount">0</span> conectados · use um apelido</span></div></div></div>`);
}
function pIntroDetetive() {
  show(`<div class="cc">
      <div class="eyebrow">Atividade 1 de 6 · 3 min 30 s · fotos reais</div>
      <h1>Detetive de <span class="accent">dados</span></h1>

// ---------- rankings + painéis ----------
async function pRanking(title, painel, stageAfter) {
  const token = renderToken;
  show(`<div class="cc"><h2>${title}</h2><p class="muted">carregando…</p></div>`);
  try {
    await H('setStage', { stage: stageAfter }); await sleep(900);
    const b = await H('board', { top: 5 }); if (token !== renderToken) return;
    await pollStatus();
    const max = Math.max(1, ...b.top.map((x) => x.total)); const md = ['🥇', '🥈', '🥉', '4º', '5º'];
    const rows = b.top.length ? b.top.map((x, i) => `<div class="rrow" style="animation-delay:${i * 90}ms"><div class="pos">${md[i]}</div><div class="nick">${esc(x.nick)}</div><div class="bar"><i style="width:${Math.max(6, x.total / max * 100)}%"></i></div><div class="pts">${x.total}</div></div>`).join('') : '<p class="muted">Ninguém pontuou ainda.</p>';
    let side = '';
    if (painel === 'detetive') {
      const d = b.detetive; const pm = Math.max(1, ...d.regraCount.map((r) => r.n));
      side = `<div class="rank-col"><h2>Painel da turma</h2>
        <div class="pbox">🔎 Enviaram: <b>${d.enviaram}</b> de ${b.count}</div>
        <div class="pbox">Média de acertos: <b>${d.marcasMedia}/6</b> no "acertou?" e <b>${d.olhouMedia}/6</b> no "onde olhou?"</div>
        <div class="pbox">Que regra a turma achou que a IA aprendeu:${d.regraCount.map((r) => `<div class="mbar ${r.certa ? 'good' : ''}"><span>${esc(r.regra)}</span><div class="t"><i style="width:${r.n / pm * 100}%"></i></div><b>${r.n}</b></div>`).join('')}</div></div>`;
    } else if (painel === 'treino') {
      const t = b.treino;
      side = `<div class="rank-col"><h2>Painel da turma</h2>
        <div class="pbox">🎓 Treinaram: <b>${t.jogaram}</b> de ${b.count} · melhor nota média: <b>${t.melhorMedia}/${t.total}</b></div>
        <div class="pbox">🎉 Fizeram a IA tirar <b>${t.total}/${t.total}</b>: <b>${t.perfeitos}</b></div>
        <div class="pbox">🔮 Acertaram a própria previsão: <b>${t.previram}</b> · tentativas em média: <b>${t.tentativasMedia}</b></div>
        <div class="pbox">💡 O segredo: <b>contraexemplos</b> para cada pista. Um atalho só cai com pelo menos 2 fotos que o contrariam.</div></div>`;
    }
    show(`<div class="rank-wrap"><div class="rank-col"><h2>${title}</h2>${rows}<p class="muted" style="margin-top:8px">👥 ${b.count} participantes</p></div>${side}</div>`);
  } catch (e) { show(`<div class="cc"><h2>Ops</h2><p style="color:var(--no)">${esc(e.message)}</p></div>`); }
}
