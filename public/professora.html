<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da professora · Da API à IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/pele.js"></script>
<style>
  :root { --bg:#150a28; --panel:rgba(20,8,44,.7); --card:rgba(30,14,60,.88); --line:rgba(185,138,255,.32); --ink:#f7f0ff; --soft:#e2d3fb; --mute:#b39ae0; --acc:#b98aff; --deep:#7a3fe0; --pink:#ff7ab8; --ok:#56e695; --no:#ff6b7a; --warn:#ffd166; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:radial-gradient(ellipse at top right,#2a1550 0%,#150a28 60%) fixed; color:var(--ink); padding-bottom:84px; }
  .shell { max-width:1160px; margin:0 auto; padding:18px 22px; min-height:calc(100vh - 84px); display:flex; flex-direction:column; justify-content:center; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--acc); }
  .badge { background:#1d0f3a; border:1px solid var(--acc); border-radius:999px; padding:6px 14px; }
  .status { border-color:var(--ok); color:var(--ok); } .status.off { border-color:var(--line); color:#9b86c9; } .status.bad { border-color:var(--no); color:var(--no); }
  .panel { position:relative; background:linear-gradient(rgba(20,8,44,.55),rgba(20,8,44,.72)),url('/img/fundo.jpg') center/cover #1d0f3a; border:1px solid var(--line); border-radius:24px; overflow-y:auto; overflow-x:hidden; width:100%; aspect-ratio:16/9; box-shadow:0 22px 54px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  @media (max-width:760px){ .panel{ aspect-ratio:auto; min-height:560px; } }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }
  @keyframes pop { 0%{transform:scale(.85);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .page { width:100%; height:100%; animation:fadeUp .45s cubic-bezier(.21,1.02,.73,1); display:flex; align-items:center; justify-content:center; }
  .hero { display:flex; width:100%; align-items:center; justify-content:center; gap:44px; padding:40px 56px; }
  .hero-text { flex:1 1 520px; max-width:580px; display:flex; flex-direction:column; } .hero-text > * + * { margin-top:20px; }
  .hero-side { flex:0 1 380px; }
  .cc { width:100%; max-width:960px; padding:34px 48px; text-align:center; display:flex; flex-direction:column; align-items:center; } .cc > * + * { margin-top:20px; }
  @media (max-width:760px){ .hero{flex-direction:column; padding:26px 18px; gap:24px;} .cc{padding:24px 16px;} }
  .eyebrow { font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--acc); font-weight:800; }
  h1 { font-size:36px; margin:0; line-height:1.15; letter-spacing:-.02em; } .accent { color:var(--pink); }
  h2 { font-size:27px; margin:0; letter-spacing:-.01em; } h3 { margin:0; font-size:16px; color:var(--warn); }
  p { line-height:1.6; font-size:17px; color:var(--soft); margin:0; } b, strong { color:var(--ink); }
  .muted { color:var(--mute); font-size:13.5px; }
  .q { font-size:19px; font-weight:700; color:var(--warn); background:rgba(255,209,102,.08); border-left:4px solid var(--warn); padding:14px 18px; border-radius:8px; text-align:left; }
  .name-tag { font-weight:800; color:var(--acc); }
  .btn-cta { background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; border:none; border-radius:14px; padding:15px 30px; font:inherit; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 10px 24px rgba(165,107,255,.35); }
  .link-btn { display:inline-block; background:#22123f; color:#e9dcff; border:2px solid var(--acc); border-radius:12px; padding:10px 16px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; font-size:14.5px; }
  .live { color:var(--ok); font-weight:800; font-size:17px; margin-bottom:10px; } .tchip { margin-left:10px; color:var(--warn); font-weight:900; font-variant-numeric:tabular-nums; }
  .btns2 { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .joinbox { background:var(--card); border:2px dashed var(--acc); border-radius:16px; padding:16px 18px; font-size:15.5px; text-align:left; line-height:1.6; } .joinbox b { color:var(--warn); font-size:19px; word-break:break-all; }
  .bloom { display:flex; flex-direction:column; gap:10px; text-align:left; }
  .bl { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-size:15.5px; color:var(--soft); }
  .bl b.lv { flex:none; min-width:92px; border-radius:999px; padding:3px 10px; font-size:11.5px; text-align:center; letter-spacing:.05em; background:#2f1a5a; color:var(--soft); }
  .bl.meta { border-color:var(--acc); } .bl.meta b.lv { background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; }
  .timeline { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .tl { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 6px; font-size:12.5px; text-align:center; color:var(--soft); } .tl b { display:block; font-size:13px; color:var(--ink); } .tl.th { border-style:dashed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; text-align:left; } .card > * + * { margin-top:10px; }
  .card.hl { border-color:var(--acc); background:linear-gradient(160deg,rgba(122,63,224,.3),rgba(30,14,60,.9)); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; width:100%; text-align:left; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; }
  .ph { position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:#0b0e1c; border:2px solid var(--line); }
  .ph img, .ph svg { width:100%; height:100%; object-fit:cover; display:block; }
  .float .ph { animation:floaty 3.4s ease-in-out infinite; } .float .ph:nth-child(2) { animation-delay:.6s; } .float .ph:nth-child(3) { animation-delay:1.2s; }
  .tag { position:absolute; top:7px; left:7px; font-size:12.5px; font-weight:800; padding:4px 9px; border-radius:9px; color:#fff; background:rgba(14,6,32,.86); }
  .tag.r { left:auto; right:7px; } .tag.sus { background:rgba(180,40,70,.92); } .tag.ben { background:rgba(30,120,80,.92); }
  .tag.b { top:auto; bottom:7px; }
  .foto { position:relative; aspect-ratio:4/3; border-radius:12px; background-size:cover; background-position:center; overflow:hidden; border:2px solid var(--line); }
  .foto img { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); height:70%; max-width:85%; object-fit:contain; filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .t-Fogo { background:#e8692b !important; } .t-Água { background:#3d7fe0 !important; } .t-Planta { background:#3f9e45 !important; }
  .strip6 { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; width:100%; max-width:800px; }
  .cycle { display:flex; align-items:stretch; gap:10px; width:100%; }
  .cs { flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px; font-size:14px; color:var(--soft); line-height:1.5; } .cs b { display:block; color:var(--ink); font-size:15.5px; margin:6px 0; } .cs .ic { font-size:26px; }
  .cs.hl { border-color:var(--acc); background:rgba(185,138,255,.16); }
  .arr { align-self:center; color:var(--pink); font-size:24px; font-weight:900; }
  .how { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; text-align:left; }
  .how .st { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.5; color:var(--soft); }
  .how .n { flex:none; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .art { display:flex; gap:12px; align-items:flex-start; background:rgba(255,209,102,.08); border-left:4px solid var(--warn); border-radius:12px; padding:12px 16px; font-size:15px; line-height:1.55; color:var(--soft); text-align:left; width:100%; }
  .art .ic { font-size:20px; line-height:1.25; }
  .code { font-family:ui-monospace,Consolas,monospace; font-size:14px; background:rgba(10,4,26,.85); border:1px solid var(--line); border-radius:14px; padding:14px 16px; color:#e2d3fb; text-align:left; line-height:1.6; white-space:pre; }
  .code .k { color:#b98aff; } .code .s { color:#56e695; }
  .optrow { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; } .optrow div { border-radius:14px; padding:14px 18px; font-weight:800; background:var(--card); border:1px solid var(--line); }
  .optrow div span { display:block; font-weight:500; font-size:13px; color:var(--mute); margin-top:4px; }
  .meter { display:grid; grid-template-columns:90px 1fr 44px; gap:10px; align-items:center; font-size:14.5px; font-weight:700; text-align:left; }
  .meter .t { height:14px; border-radius:8px; background:rgba(10,4,26,.7); overflow:hidden; } .meter .t i { display:block; height:100%; border-radius:8px; background:var(--no); } .meter.ok .t i { background:var(--ok); }
  .rank-wrap { display:flex; gap:32px; width:100%; max-width:1020px; padding:30px 48px; align-items:stretch; }
  .rank-col { flex:1; min-width:0; } .rank-col h2 { margin-bottom:12px; }
  .rrow { display:flex; align-items:center; gap:12px; margin:10px 0; animation:pop .35s backwards; }
  .rrow .pos { width:36px; font-size:21px; text-align:center; } .rrow .nick { width:160px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .bar { flex:1; background:var(--card); border-radius:8px; overflow:hidden; height:22px; } .rrow .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--deep),var(--pink)); border-radius:8px; }
  .rrow .pts { width:64px; text-align:right; font-weight:900; color:var(--warn); }
  .pbox { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px; font-size:14.5px; color:var(--soft); } .pbox b { color:var(--warn); }
  .mbar { display:grid; grid-template-columns:minmax(120px,1.6fr) 2fr 30px; gap:10px; align-items:center; margin:6px 0; font-size:13.5px; text-align:left; } .mbar .t { background:rgba(10,4,26,.7); border-radius:6px; height:12px; overflow:hidden; } .mbar .t i { display:block; height:100%; background:var(--acc); } .mbar.good .t i { background:var(--ok); } .mbar.bad .t i { background:var(--no); } .mbar b { color:var(--ink); }
  .mural { width:100%; max-width:1060px; padding:26px 32px; align-self:stretch; display:flex; flex-direction:column; text-align:center; }
  .mural-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; text-align:left; }
  .mural-split { display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:16px; text-align:left; } .mural-split .mural-grid { grid-template-columns:1fr; margin-top:0; max-height:52vh; overflow:auto; }
  @media (max-width:760px){ .mural-grid, .mural-split { grid-template-columns:1fr; } .rank-wrap{flex-direction:column; padding:22px 16px;} .two, .three, .how{grid-template-columns:1fr;} .cycle{flex-direction:column;} .arr{transform:rotate(90deg);} .timeline{grid-template-columns:repeat(3,1fr);} .strip6{grid-template-columns:repeat(3,1fr);} }
  .note { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; animation:pop .3s backwards; } .note .who { font-weight:800; font-size:12.5px; color:var(--acc); } .note .fr { font-size:14.5px; color:var(--ink); margin-top:5px; line-height:1.5; }
  .ref { font-size:12.5px; color:var(--mute); text-align:left; line-height:1.55; }
  .navbar { position:fixed; bottom:0; left:0; right:0; z-index:50; background:#120822; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px)); gap:10px; }
  .nav-btn { background:#1d0f3a; color:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 20px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
  .nav-btn:disabled { opacity:.3; cursor:default; } .nav-btn.primary { background:linear-gradient(135deg,var(--deep),var(--pink)); color:#fff; border:none; }
  .dot { font-size:12px; color:var(--mute); font-weight:700; }
  .menu { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#1d0f3a; border:1px solid var(--line); border-radius:14px; padding:12px; display:none; flex-direction:column; gap:8px; z-index:60; min-width:260px; } .menu.open { display:flex; }
  .overlay { position:fixed; inset:0; background:linear-gradient(rgba(18,8,38,.7),rgba(18,8,38,.8)),url('/img/fundo.jpg') center/cover #150a28; z-index:100; display:flex; align-items:center; justify-content:center; } .overlay .box2 { width:92%; max-width:360px; text-align:center; } .overlay .box2 > * + * { margin-top:16px; }
  .input { width:100%; padding:13px 15px; border-radius:12px; border:2px solid var(--line); background:#1d0f3a; color:var(--ink); font:inherit; font-size:16px; }
  .err { color:var(--no); font-size:14px; min-height:18px; }
  /* cronômetro geral da apresentação (discreto, canto de cima) */
  .pres-timer { position:fixed; top:10px; right:12px; z-index:40; font:600 13px/1 ui-monospace,Menlo,Consolas,monospace; color:var(--soft); background:rgba(18,8,34,.55); border:1px solid var(--line); border-radius:999px; padding:6px 10px; opacity:.55; cursor:pointer; user-select:none; transition:opacity .2s; }
  .pres-timer:hover, .pres-timer.paused { opacity:1; }
  .pres-timer.paused { color:var(--warn); }
</style>
</head>
<body>
<div class="overlay" id="login"><div class="box2">
  <h2>🔐 Painel da professora</h2>
  <input class="input" id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="btn-cta" id="loginBtn">Entrar</button>
</div></div>

<div class="shell">
  <div class="topbar">
    <span class="badge">Educação em Computação • Unesp • 2026</span>
    <span class="badge status off" id="statusChip">conectando…</span>
    <span class="badge" id="bloomBadge">Bloom: —</span>
  </div>
  <div class="panel" id="app"></div>
</div>
<div class="menu" id="menu">
  <button class="link-btn" onclick="closeStage()">⏹ Encerrar etapa agora</button>
  <button class="link-btn" style="border-color:var(--no);color:var(--no)" onclick="resetAula()">🗑 Reiniciar aula (apaga jogadores)</button>
</div>
<div class="navbar">
  <button class="nav-btn" id="backBtn" onclick="navBack()">← Voltar</button>
  <span class="dot" id="dot">1/9</span>
  <button class="nav-btn" onclick="document.getElementById('menu').classList.toggle('open')">⚙</button>
  <button class="nav-btn primary" id="nextBtn" onclick="navNext()">Avançar →</button>
</div>

<script>
const IMG = (n) => '/img/' + n;
const app = document.getElementById('app');
let PW = sessionStorage.getItem('aula_ia2_pw') || '';
let status = null, idx = 0, renderToken = 0, clockOffset = 0, muralTimer = null;
const ACTIVE = ['detetive', 'pesquisa', 'treino', 'auditoria', 'plano'];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STAGE_NAME = { lobby: 'Sala de espera', detetive: 'Detetive', pesquisa: 'Pesquisa', treino: 'Treinador', auditoria: 'Auditoria', plano: 'Plano de dados', closed: 'Etapa encerrada', final: 'Finalização' };
const foto = (pk, fundo, tag = '') => `<div class="foto" style="background-image:url('${IMG('bg-' + fundo + '.jpg')}')"><img src="${IMG('pk-' + pk + '.png')}" alt="">${tag}</div>`;
const SK = { s1: { id: 's1', tom: 1, lesao: 'suspeita', regua: true }, s2: { id: 's2', tom: 4, lesao: 'benigna', regua: true }, s3: { id: 's3', tom: 2, lesao: 'suspeita', regua: false }, s4: { id: 's4', tom: 5, lesao: 'benigna', regua: false } };
const skin = (k, tag = '', heat = null) => `<div class="ph">${pele(SK[k], { heat })}${tag}</div>`;
const how = (steps) => `<div class="how">${steps.map((t, i) => `<div class="st"><span class="n">${i + 1}</span><span>${t}</span></div>`).join('')}</div>`;
const art = (html) => `<div class="art"><span class="ic">📄</span><span>${html}</span></div>`;

async function H(action, extra = {}) {
  const r = await fetch('/api/host', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: PW, action, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'erro');
  return j;
}
async function pollStatus() {
  const chip = document.getElementById('statusChip');
  try {
    status = await H('board', { top: 1 });
    clockOffset = (status.serverNow || Date.now()) - Date.now();
    const active = ACTIVE.includes(status.stage);
    chip.className = 'badge status' + (active ? '' : ' off');
    chip.textContent = `${active ? '🔓 ' : ''}${STAGE_NAME[status.stage] || status.stage} · 👥 ${status.count}` + (active ? ` · ✅ ${status.doneNow}/${status.count}` : '');
    paintUnlock(); const jc = document.getElementById('joinCount'); if (jc) jc.textContent = status.count;
  } catch (e) { chip.className = 'badge status bad'; chip.textContent = '⚠ ' + e.message; }
}
function tickTimer() {
  const c = document.getElementById('tchip'); if (!c || !status || !status.deadline) return;
  const left = Math.max(0, status.deadline - (Date.now() + clockOffset)); const t = Math.ceil(left / 1000);
  c.textContent = left > 0 ? '⏱ ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') : '⏱ tempo esgotado';
}
setInterval(tickTimer, 500);
function paintUnlock() {
  document.querySelectorAll('.unlock').forEach((z) => {
    if (!status) return;
    if (status.stage === z.dataset.stage) {
      z.innerHTML = `<div class="live">✅ Liberado: ${status.doneNow}/${status.count} concluíram${status.deadline ? '<span class="tchip" id="tchip"></span>' : ''}</div><div class="btns2">${status.deadline ? '<button class="link-btn" onclick="extendStage()">+30s</button>' : ''}<button class="link-btn" onclick="closeStage()">Encerrar etapa</button></div>`;
      tickTimer();
    } else if (!z.querySelector('button.btn-cta')) z.innerHTML = `<button class="btn-cta" onclick="unlock('${z.dataset.stage}')">🔓 ${z.dataset.label}</button>`;
  });
}
const unlockZone = (stage, label) => `<div class="unlock" data-stage="${stage}" data-label="${label}"><button class="btn-cta" onclick="unlock('${stage}')">🔓 ${label}</button></div>`;
async function unlock(stage) { try { await H('setStage', { stage }); await pollStatus(); } catch (e) { alert(e.message); } }
async function extendStage() { try { await H('extend', { ms: 30000 }); await pollStatus(); } catch (e) { alert(e.message); } }
async function closeStage() { document.getElementById('menu').classList.remove('open'); try { await H('setStage', { stage: 'closed' }); await pollStatus(); } catch (e) { alert(e.message); } }
async function resetAula() {
  document.getElementById('menu').classList.remove('open');
  if (!confirm('Apagar todos os jogadores e voltar para a sala de espera?')) return;
  try { await H('reset'); await pollStatus(); } catch (e) { alert(e.message); }
}

// ================== PÁGINAS ==================
const pages = [
  { num: 1, bloom: '—', render: pAbertura },
  { num: 2, bloom: 'meta: Analisar', render: pObjetivos },
  { num: 3, bloom: 'Analisar', render: pIntroDetetive },
  { num: null, bloom: 'Analisar', render: () => pRanking('Ranking: Detetive de dados', 'detetive', 'closed') },
  { num: 4, bloom: 'Entender', render: pExplicacao1, closeOnEnter: true },
  { num: 4, bloom: 'Entender', render: pExplicacao2 },
  { num: 5, bloom: 'Analisar', render: pIntroPesquisa },
  { num: null, bloom: 'Analisar', render: pMuralPesquisa },
  { num: 6, bloom: 'Aplicar', render: pIntroTreino, closeOnEnter: true },
  { num: null, bloom: 'Aplicar', render: () => pRanking('Ranking: Treinador', 'treino', 'closed') },
  { num: 7, bloom: 'Analisar', render: pIntroAuditoria },
  { num: null, bloom: 'Analisar', render: () => pRanking('Ranking: Auditoria', null, 'closed') },
  { num: 8, bloom: 'Criar', render: pIntroPlano },
  { num: null, bloom: 'Criar', render: pMuralPlano },
  { num: null, bloom: 'Concluído ✓', render: () => pRanking('🏆 Ranking final', null, 'final') },
  { num: 9, bloom: 'Concluído ✓', render: pFinal },
];
function render() {
  const p = pages[idx];
  if (muralTimer) { clearInterval(muralTimer); muralTimer = null; }
  document.getElementById('bloomBadge').textContent = 'Bloom: ' + p.bloom;
  document.getElementById('dot').textContent = p.num ? p.num + '/9' : '📊 painel';
  document.getElementById('backBtn').disabled = idx === 0;
  document.getElementById('nextBtn').style.visibility = idx === pages.length - 1 ? 'hidden' : 'visible';
  renderToken++; p.render(); paintUnlock();

async function pRanking(title, painel, stageAfter) {
  const token = renderToken;
  show(`<div class="cc"><h2>${title}</h2><p class="muted">carregando…</p></div>`);
  try {
    await H('setStage', { stage: stageAfter }); await sleep(900);
    const b = await H('board', { top: 5 }); if (token !== renderToken) return;
    await pollStatus();
    const max = Math.max(1, ...b.top.map((x) => x.total)); const md = ['🥇', '🥈', '🥉', '4º', '5º'];
    const rows = b.top.length ? b.top.map((x, i) => `<div class="rrow" style="animation-delay:${i * 90}ms"><div class="pos">${md[i]}</div><div class="nick">${esc(x.nick)}</div><div class="bar"><i style="width:${Math.max(6, x.total / max * 100)}%"></i></div><div class="pts">${x.total}</div></div>`).join('') : '<p class="muted">Ninguém pontuou ainda.</p>';
    let side = '';
    if (painel === 'detetive') {
      const d = b.detetive; const pm = Math.max(1, ...d.regraCount.map((r) => r.n));
      side = `<div class="rank-col"><h2>Painel da turma</h2>
        <div class="pbox">🔎 Enviaram: <b>${d.enviaram}</b> de ${b.count}</div>
        <div class="pbox">Média de acertos: <b>${d.marcasMedia}/6</b> no "acertou?" e <b>${d.olhouMedia}/6</b> no "onde olhou?"</div>
        <div class="pbox">Que regra a turma achou que a IA aprendeu:${d.regraCount.map((r) => `<div class="mbar ${r.certa ? 'good' : ''}"><span>${esc(r.regra)}</span><div class="t"><i style="width:${r.n / pm * 100}%"></i></div><b>${r.n}</b></div>`).join('')}</div></div>`;
    } else if (painel === 'treino') {
      const t = b.treino;
      side = `<div class="rank-col"><h2>Painel da turma</h2>
        <div class="pbox">🎓 Treinaram: <b>${t.jogaram}</b> de ${b.count} · melhor nota média: <b>${t.melhorMedia}/${t.total}</b></div>
        <div class="pbox">🎉 Fizeram a IA tirar <b>${t.total}/${t.total}</b>: <b>${t.perfeitos}</b></div>
        <div class="pbox">🔮 Acertaram a própria previsão: <b>${t.previram}</b> · tentativas em média: <b>${t.tentativasMedia}</b></div>
        <div class="pbox">🚀 Chegaram ao nível 2 (olhômetro): <b>${t.nivel2 || 0}</b> · tiraram ${t.total2 || 4}/${t.total2 || 4}: <b>${t.nivel2Perfeitos || 0}</b></div>
        <div class="pbox">💡 O segredo: <b>contraexemplos</b> para cada pista. Um atalho só cai com pelo menos 2 fotos que o contrariam.</div></div>`;
    }
    show(`<div class="rank-wrap"><div class="rank-col"><h2>${title}</h2>${rows}<p class="muted" style="margin-top:8px">👥 ${b.count} participantes</p></div>${side}</div>`);
  } catch (e) { show(`<div class="cc"><h2>Ops</h2><p style="color:var(--no)">${esc(e.message)}</p></div>`); }
}

<div class="pres-timer" id="presTimer" title="Cronômetro da apresentação: clique para iniciar/pausar, clique duplo para zerar">⏱ iniciar</div>
<script>
// Cronômetro geral da apresentação: começa no 1º clique; clique pausa/retoma; duplo clique zera.
// Fica salvo no navegador (recarregar a página não zera).
(function () {
  const el = document.getElementById('presTimer');
  const KEY = 'presTimer';
  let st = { start: null, acc: 0 };
  try { st = JSON.parse(localStorage.getItem(KEY)) || st; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const elapsed = () => st.acc + (st.start ? Date.now() - st.start : 0);
  function draw() {
    const t = Math.floor(elapsed() / 1000);
    if (!st.start && !st.acc) { el.textContent = '⏱ iniciar'; el.classList.remove('paused'); return; }
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    el.textContent = '⏱ ' + (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
    el.classList.toggle('paused', !st.start);
  }
  let clickTimer = null;
  el.addEventListener('click', () => {
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      if (st.start) { st.acc += Date.now() - st.start; st.start = null; } else { st.start = Date.now(); }
      save(); draw();
    }, 250);
  });
  el.addEventListener('dblclick', () => {
    clearTimeout(clickTimer);
    if (confirm('Zerar o cronômetro da apresentação?')) { st = { start: null, acc: 0 }; save(); draw(); }
  });
  setInterval(draw, 1000);
  draw();
})();
</script>
